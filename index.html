<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zenodrop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#0d0f17;
font-family:'Segoe UI',Roboto,sans-serif;
color:#d1d5db;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:16px;
overflow-x:hidden
}

.container{
width:100%;
max-width:480px;
display:flex;
flex-direction:column;
gap:16px
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:0 4px
}

.logo-area{
font-weight:900;
font-size:18px;
color:#fff;
text-transform:uppercase;
letter-spacing:1.5px;
text-shadow:0 0 15px rgba(245,158,11,.4)
}

.logo-area span{color:#f59e0b}

.profile-avatar-btn{
width:38px;
height:38px;
border-radius:50%;
background:#161924;
border:2px solid rgba(245,158,11,.4);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
overflow:hidden;
transition:.2s
}

.profile-avatar-btn img{
width:100%;
height:100%;
object-fit:cover
}

.main-nav{
display:flex;
gap:8px;
background:#161924;
padding:4px;
border-radius:12px;
border:1px solid rgba(255,255,255,.06)
}

.main-tab{
flex:1;
background:transparent;
border:none;
color:#9ca3af;
padding:10px 0;
border-radius:8px;
font-weight:800;
font-size:13px;
cursor:pointer;
text-transform:uppercase;
letter-spacing:.5px;
transition:.2s
}

.main-tab.active{
background:#f59e0b;
color:#11131c;
box-shadow:0 0 15px rgba(245,158,11,.3)
}

.tab-content{
display:none;
flex-direction:column;
gap:16px;
width:100%
}

.tab-content.active{display:flex}

.zeno-layout{
display:flex;
flex-direction:column;
gap:16px;
width:100%
}

.wheel-container{
display:flex;
flex-direction:column;
align-items:center;
gap:16px;
width:100%
}

.wheel-wrapper{
position:relative;
width:220px;
height:220px;
filter:drop-shadow(0 0 20px rgba(0,0,0,.6))
}

.wheel-pointer{
position:absolute;
top:-8px;
left:50%;
transform:translateX(-50%);
width:0;
height:0;
border-left:9px solid transparent;
border-right:9px solid transparent;
border-top:16px solid #fbbf24;
z-index:20;
filter:drop-shadow(0 0 8px rgba(251,191,36,.8))
}

.wheel-canvas-box{
width:100%;
height:100%;
border-radius:50%;
position:relative;
overflow:hidden;
box-shadow:0 0 25px rgba(0,0,0,.8);
background:#161924
}

.wheel-wrapper canvas{
width:100%;
height:100%;
display:block;
transform-origin:center center
}

.wheel-center-content{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
flex-direction:column;
align-items:center;
pointer-events:none;
z-index:5
}

.wheel-percent{
font-size:26px;
font-weight:900;
color:#4ade80;
line-height:1;
text-shadow:0 0 10px rgba(74,222,128,.4)
}

.wheel-chance-label{
font-size:10px;
text-transform:uppercase;
letter-spacing:1px;
color:#9ca3af;
margin-top:4px;
font-weight:600
}

.disabled-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
border-radius:50%;
z-index:10;
display:none
}

#resultOverlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(11,13,20,.82);
border-radius:50%;
display:none;
justify-content:center;
align-items:center;
z-index:15;
flex-direction:column;
backdrop-filter:blur(2px)
}

#resultText{
font-size:22px;
font-weight:900;
text-transform:uppercase;
letter-spacing:1px;
text-shadow:0 2px 10px rgba(0,0,0,.8)
}

.btn-upgrade{
background:linear-gradient(135deg,#f59e0b,#d97706);
border:none;
color:#11131c;
padding:14px 0;
width:100%;
border-radius:14px;
font-weight:900;
font-size:15px;
cursor:pointer;
text-transform:uppercase;
letter-spacing:1px;
transition:.3s;
box-shadow:0 4px 20px rgba(245,158,11,.4)
}

.btn-upgrade:hover:not(:disabled){
box-shadow:0 6px 25px rgba(245,158,11,.6);
transform:translateY(-1px)
}

.btn-upgrade:disabled{
opacity:.5;
cursor:not-allowed;
box-shadow:none
}

.quick-chance-panel{
display:flex;
gap:6px;
width:100%;
justify-content:center;
align-items:center;
flex-wrap:wrap
}

.q-btn{
background:#161924;
border:1px solid rgba(255,255,255,.08);
color:#d1d5db;
padding:6px 12px;
border-radius:8px;
font-size:12px;
font-weight:700;
cursor:pointer;
transition:.2s
}

.q-btn:hover,.q-btn.active{
border-color:#f59e0b;
color:#f59e0b;
background:rgba(245,158,11,.05)
}

.q-btn.settings-btn{
background:rgba(245,158,11,.1);
border-color:rgba(245,158,11,.3);
color:#f59e0b
}

.skins-selection-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:100%
}

.card-skin{
background:linear-gradient(145deg,#161924,#11131c);
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:14px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
min-height:180px;
justify-content:space-between;
position:relative;
box-shadow:0 10px 20px rgba(0,0,0,.4)
}

.skin-type{
font-size:10px;
text-transform:uppercase;
letter-spacing:1px;
color:#9ca3af;
font-weight:700
}

.skin-name{
font-size:13px;
font-weight:800;
color:#fff;
margin:2px 0;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
width:100%
}

.skin-img-wrap{
width:100%;
height:75px;
display:flex;
align-items:center;
justify-content:center;
position:relative
}

.skin-img-wrap img{
max-width:100%;
max-height:70px;
object-fit:contain;
filter:drop-shadow(0 5px 10px rgba(0,0,0,.8))
}

.skin-price{
font-size:14px;
font-weight:800;
color:#fbbf24
}

.inventory-section{
background:linear-gradient(145deg,#161924,#11131c);
border:1px solid rgba(255,255,255,.06);
border-radius:20px;
padding:16px;
display:flex;
flex-direction:column;
gap:12px;
box-shadow:0 10px 30px rgba(0,0,0,.3)
}

.inv-header-row{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:8px
}

.inv-tabs{
display:flex;
gap:6px;
flex-wrap:wrap
}

.inv-tab{
background:#11131c;
border:1px solid rgba(255,255,255,.06);
color:#9ca3af;
padding:6px 10px;
border-radius:8px;
font-weight:700;
font-size:11px;
cursor:pointer
}

.inv-tab.active{
background:#f59e0b;
color:#11131c;
border-color:#f59e0b;
box-shadow:0 0 15px rgba(245,158,11,.3)
}

.price-filter-box{
display:none;
gap:6px;
align-items:center
}

.price-filter-box.active{display:flex}

.price-input{
background:#11131c;
border:1px solid rgba(255,255,255,.1);
border-radius:6px;
color:#fff;
padding:4px 8px;
width:75px;
font-size:11px;
outline:none;
font-weight:600
}

.items-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
gap:8px;
max-height:220px;
overflow-y:auto;
padding-right:4px
}

.item-card{
background:#11131c;
border:1px solid rgba(255,255,255,.06);
border-radius:10px;
padding:8px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
cursor:pointer;
position:relative;
transition:.3s
}

.item-card:hover{
border-color:rgba(245,158,11,.4);
transform:translateY(-2px)
}

.item-card.selected{
border-color:#f59e0b;
box-shadow:0 0 10px rgba(245,158,11,.2)
}

.item-card img{
width:65px;
height:45px;
object-fit:contain;
margin:4px 0;
filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))
}

.item-card .iname{
font-size:10px;
font-weight:700;
color:#d1d5db;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
width:100%
}

.item-card .iprice{
font-size:11px;
font-weight:800;
color:#fbbf24;
margin-top:3px
}

/* КЕЙСЫ */
.cases-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
width:100%
}

.case-card{
background:linear-gradient(145deg,#161924,#11131c);
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:16px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
cursor:pointer;
transition:.3s
}

.case-card:hover{
border-color:#f59e0b;
transform:translateY(-3px)
}

.case-title{
font-size:13px;
font-weight:800;
color:#fff;
margin-bottom:4px
}

.case-price{
font-size:13px;
font-weight:800;
color:#fbbf24
}

.case-opening-view{
display:none;
flex-direction:column;
gap:16px;
width:100%;
align-items:center
}

.case-opening-view.active{display:flex}

.back-cases-btn{
align-self:flex-start;
background:#161924;
border:1px solid rgba(255,255,255,.08);
color:#9ca3af;
padding:6px 12px;
border-radius:8px;
font-weight:700;
font-size:12px;
cursor:pointer
}

.roulette-container{
position:relative;
overflow:hidden;
width:100%;
height:120px;
background:#151518;
border-radius:12px;
border:1px solid #2a2a2e
}

.roulette-track{
display:flex;
gap:10px;
position:absolute;
left:0;
top:0;
height:100%
}

.roulette-item{
width:100px;
min-width:100px;
height:100%;
background:#1a1a1e;
border:1px solid #2f2f35;
border-radius:8px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:12px;
position:relative
}

.roulette-pointer{
position:absolute;
left:50%;
top:0;
bottom:0;
width:3px;
transform:translateX(-50%);
background:linear-gradient(180deg,#ffb800,#ff8c00);
z-index:20;
pointer-events:none
}

.action-buttons{
display:none;
gap:10px;
width:100%
}

.action-btn{
flex:1;
padding:12px 10px;
border-radius:12px;
font-weight:900;
cursor:pointer;
font-size:14px;
border:none;
text-transform:uppercase
}

.sell-btn{
background:#2a2a2e;
color:#ffb800;
border:1px solid #ffb800
}

.retry-btn{
background:linear-gradient(135deg,#ffb800,#ff8c00);
color:#000
}

/* ПРОФИЛЬ */
.profile-wrapper{
display:flex;
flex-direction:column;
gap:12px;
width:100%
}

.profile-main-card{
background:linear-gradient(145deg,#161924,#11131c);
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:16px;
display:flex;
flex-direction:column;
gap:14px
}

.profile-top-row{
display:flex;
justify-content:space-between;
align-items:center;
font-size:12px;
font-weight:700;
color:#9ca3af
}

.profile-username{
color:#fff;
font-weight:800;
font-size:14px
}

.profile-actions-top span{
cursor:pointer;
transition:.2s
}

.profile-actions-top span:hover{color:#f59e0b}

.profile-center-row{
display:flex;
align-items:center;
justify-content:center
}

.profile-avatar-large{
width:72px;
height:72px;
border-radius:50%;
background:#000;
border:2px solid rgba(255,255,255,.1);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.profile-avatar-large img{
width:100%;
height:100%;
object-fit:cover
}

.profile-balance-row{
display:flex;
justify-content:space-between;
align-items:center;
background:#11131c;
padding:12px 14px;
border-radius:12px;
border:1px solid rgba(255,255,255,.06)
}

.balance-amount{
font-size:16px;
font-weight:900;
color:#fff
}

.balance-history{
font-size:11px;
color:#9ca3af;
cursor:pointer
}

.topup-btn{
background:linear-gradient(135deg,#f59e0b,#d97706);
color:#11131c;
border:none;
padding:10px 18px;
border-radius:10px;
font-weight:900;
font-size:12px;
cursor:pointer;
text-transform:uppercase
}

.stats-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
width:100%;
margin-top:4px
}

.stat-card{
background:#11131c;
border:1px solid rgba(255,255,255,.06);
border-radius:12px;
padding:10px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
gap:4px
}

.stat-title{
font-size:9px;
color:#9ca3af;
text-transform:uppercase;
font-weight:700
}

.stat-value{
font-size:13px;
font-weight:900;
color:#fff
}

.best-drop-card{
background:linear-gradient(145deg,#161924,#11131c);
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:14px 16px;
display:flex;
flex-direction:column;
gap:8px
}

.best-drop-title{
font-size:10px;
font-weight:800;
color:#9ca3af;
text-transform:uppercase;
letter-spacing:.5px
}

.best-drop-content{
display:flex;
justify-content:space-between;
align-items:center
}

.best-drop-name{
font-size:12px;
font-weight:700;
color:#d1d5db
}

.best-drop-price{
font-size:14px;
font-weight:900;
color:#fbbf24
}

.best-drop-img{
width:55px;
height:40px;
object-fit:contain
}

.profile-inventory-box{
display:flex;
flex-direction:column;
gap:12px;
background:linear-gradient(145deg,#161924,#11131c);
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:16px
}

#modalOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
z-index:100;
backdrop-filter:blur(4px)
}

.modal-card{
background:#161924;
border:1px solid rgba(255,255,255,.1);
border-radius:16px;
padding:20px;
width:300px;
display:flex;
flex-direction:column;
gap:12px
}

.modal-inputs input{
background:#11131c;
border:1px solid rgba(255,255,255,.1);
border-radius:8px;
color:#fff;
padding:8px;
font-size:13px;
width:100%
}

.modal-buttons{
display:flex;
gap:8px;
margin-top:8px
}

.modal-buttons button{
flex:1;
padding:8px;
border-radius:8px;
font-weight:700;
cursor:pointer;
border:none
}

.btn-save{background:#f59e0b;color:#11131c}
.btn-close{background:#272a37;color:#9ca3af}

.loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0d0f17;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
color:#fff;
font-weight:800;
gap:12px;
transition:opacity 0.5s ease
}

.spinner {
width: 40px;
height: 40px;
border: 4px solid rgba(245,158,11,0.2);
border-top: 4px solid #f59e0b;
border-radius: 50%;
animation: spin 1s linear infinite;
}

@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <div id="loadingText">Загрузка SkinLoader и базы предметов...</div>
</div>

<div class="container">

<div class="header">
<div class="logo-area"><span>Zeno</span>drop</div>
<div class="profile-avatar-btn" id="headerProfileBtn" onclick="switchMainTab('profile')">
<div id="headerAvatarContainer" style="width:100%;height:100%;background:#000;"></div>
</div>
</div>

<div class="main-nav">
<button class="main-tab active" id="navUpgrade" onclick="switchMainTab('upgrade')">Апгрейд</button>
<button class="main-tab" id="navCases" onclick="switchMainTab('cases')">Кейсы</button>
<button class="main-tab" id="navProfile" onclick="switchMainTab('profile')">Профиль</button>
</div>

<div class="tab-content active" id="tabUpgradeContent">
<div class="zeno-layout">

<div class="wheel-container">
<div class="wheel-wrapper">
<div class="wheel-pointer"></div>
<div class="wheel-canvas-box">
<canvas id="wheelCanvas" width="300" height="300"></canvas>
</div>

<div class="wheel-center-content">
<div class="wheel-percent" id="wheelPercent">0.00%</div>
<div class="wheel-chance-label">шанс</div>
</div>

<div class="disabled-overlay" id="wheelOverlay"></div>

<div id="resultOverlay">
<span id="resultText">Неудача</span>
</div>
</div>

<button class="btn-upgrade" id="upgradeBtn" disabled>Прокачать</button>
</div>

<div class="quick-chance-panel" id="quickChancePanel"></div>

<div class="skins-selection-row">
<div class="card-skin">
<div class="skin-type">Ваш скин</div>
<div class="skin-name" id="selectedSkinName">--</div>
<div class="skin-img-wrap">
<img id="selectedSkinImg" src="" alt="" style="display:none;max-height:70px;object-fit:contain;">
<span id="selectedSkinPlaceholder" style="color:#4b5563;font-size:11px;">Выберите</span>
</div>
<div class="skin-price" id="selectedSkinPrice">0.00</div>
</div>

<div class="card-skin" style="border-color:rgba(245,158,11,.2);">
<div class="skin-type">Желаемый</div>
<div class="skin-name" id="targetSkinName">--</div>
<div class="skin-img-wrap">
<img id="targetSkinImg" src="" alt="" style="display:none;max-height:70px;object-fit:contain;">
<span id="targetSkinPlaceholder" style="color:#4b5563;font-size:11px;">Из каталога</span>
</div>
<div class="skin-price" id="targetSkinPrice">0.00</div>
</div>
</div>

<div class="inventory-section">
<div class="inv-header-row">
<div class="inv-tabs">
<button class="inv-tab active" id="tabInventory" onclick="switchCatalogTab('inventory')">Мои</button>
<button class="inv-tab" id="tabCatalogSkins" onclick="switchCatalogTab('skins')">Скины</button>
<button class="inv-tab" id="tabCatalogStickers" onclick="switchCatalogTab('stickers')">Наклейки</button>
<button class="inv-tab" id="tabCatalogMusic" onclick="switchCatalogTab('music')">Музыка</button>
</div>

<div class="price-filter-box" id="priceFilterBox">
<input type="number" id="minPriceInput" class="price-input" placeholder="От" value="0">
<span style="color:#6b7280;font-size:11px;">-</span>
<input type="number" id="maxPriceInput" class="price-input" placeholder="До" value="1000000">
</div>
</div>

<div class="items-grid" id="itemsGrid"></div>
</div>

</div>
</div>

<!-- КЕЙСЫ -->
<div class="tab-content" id="tabCasesContent">
<div id="casesListContainer" style="display:flex;flex-direction:column;gap:16px;">
<div style="font-size:15px;font-weight:800;color:#fff;">Коллекция кейсов</div>
<div class="cases-grid" id="casesGrid"></div>
</div>

<div class="case-opening-view" id="caseOpeningView">
<button class="back-cases-btn" onclick="closeCaseOpening()">← Назад к кейсам</button>
<div style="font-size:16px;font-weight:900;color:#fff;" id="activeCaseTitle">Кейс</div>

<div class="roulette-container">
<div class="roulette-pointer"></div>
<div class="roulette-track" id="rouletteTrack"></div>
</div>

<button class="btn-upgrade" id="mainOpenBtn" onclick="startOpening()">Открыть кейс</button>

<div class="action-buttons" id="actionButtons">
<button class="action-btn sell-btn" id="sellBtn" onclick="sellCurrentItem()">Продать</button>
<button class="action-btn retry-btn" onclick="startOpening()">Еще раз</button>
</div>

<div class="inventory-section" style="width:100%;margin-top:4px;flex:1;">
<div style="font-size:12px;font-weight:800;color:#9ca3af;text-transform:uppercase;margin-bottom:4px;">Содержимое кейса</div>
<div class="items-grid" id="caseContentsGrid" style="max-height:none;flex:1;min-height:220px;"></div>
</div>
</div>
</div>

<!-- ПРОФИЛЬ -->
<div class="tab-content" id="tabProfileContent">
<div class="profile-wrapper" id="profileContentArea"></div>
</div>

</div>

<div id="modalOverlay">
<div class="modal-card">
<h3>Настройка быстрых кнопок</h3>
<p style="font-size:11px;color:#9ca3af;">Введите проценты (максимум до 70%)</p>
<div class="modal-inputs">
<input type="text" id="quickValuesInput" value="10, 20, 30, 40, 50, 70">
</div>
<div class="modal-buttons">
<button class="btn-close" id="modalCloseBtn" onclick="document.getElementById('modalOverlay').style.display='none'">Отмена</button>
<button class="btn-save" id="modalSaveBtn">Сохранить</button>
</div>
</div>
</div>

<script>
// --- SKIN LOADER MODULE ---
const SkinLoader = {
    cacheKey: 'zeno_skins_db_v3',
    
    generateVisual(name, category, value) {
        let accentColor = '#f59e0b';
        if (value > 20000) accentColor = '#ef4444';
        else if (value > 5000) accentColor = '#a855f7';
        else if (value > 1000) accentColor = '#3b82f6';
        else if (value > 300) accentColor = '#06b6d4';

        // Рисуем красивую графическую карточку оружия вместо простой стрелки
        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
            <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#0f172a" />
                </linearGradient>
            </defs>
            <rect width="160" height="100" rx="12" fill="url(#bg)" stroke="${accentColor}" stroke-width="2" stroke-opacity="0.6"/>
            <text x="12" y="22" fill="${accentColor}" font-size="11" font-family="sans-serif" font-weight="900">${value} ₽</text>
            <path d="M25 65 L60 45 L105 55 L135 35" stroke="${accentColor}" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
            <circle cx="60" cy="45" r="4" fill="${accentColor}"/>
            <circle cx="105" cy="55" r="4" fill="${accentColor}"/>
            <text x="12" y="85" fill="#94a3b8" font-size="9" font-family="sans-serif" font-weight="bold">${name.split('(')[0].trim()}</text>
        </svg>`;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svgString);
    },

    async loadDatabase() {
        // Пробуем загрузить по твоей ссылке на API внешнюю базу, если доступна, либо генерируем красивую
        try {
            const res = await fetch('https://spacerulerwill.github.io/CS2-API/api/skins.json');
            if (res.ok) {
                const apiData = await res.json();
                if (Array.isArray(apiData) && apiData.length > 0) {
                    return apiData.map((skin, index) => ({
                        id: skin.id || 'skin_' + index,
                        name: skin.name || 'Скин CS2',
                        category: skin.category || 'skins',
                        value: skin.price || Math.floor(Math.random() * 5000) + 200,
                        img: skin.image || this.generateVisual(skin.name || 'Скин', 'skins', skin.price || 500)
                    }));
                }
            }
        } catch(e) {}

        try {
            const cached = localStorage.getItem(this.cacheKey);
            if (cached) {
                return JSON.parse(cached);
            }
        } catch(e) {}

        let items = [];
        const weapons = ['AK-47', 'AWP', 'M4A4', 'M4A1-S', 'Desert Eagle', 'USP-S', 'Glock-18'];
        const skinNames = ['Красная линия', 'Азимов', 'Вой', 'Градиент', 'Убийство', 'Поток информации', 'Неонуар'];
        const qualities = ['Прямо с завода', 'После полевых испытаний', 'Поношенное'];

        let id = 1;
        weapons.forEach(w => {
            skinNames.forEach(s => {
                qualities.forEach(q => {
                    const fullName = `${w} | ${s} (${q})`;
                    const price = Math.floor((w.length * s.length * 55) % 35000) + 150;
                    items.push({
                        id: 'skin_' + (id++),
                        name: fullName,
                        category: 'skins',
                        value: price,
                        img: this.generateVisual(fullName, 'skins', price)
                    });
                });
            });
        });

        for(let i=1; i<=25; i++) {
            const stName = `Наклейка | Titan | Katowice 201${i%5} (#${i})`;
            const price = 80 + i * 150;
            items.push({ id: 'st_' + i, name: stName, category: 'stickers', value: price, img: this.generateVisual(stName, 'stickers', price) });
            
            const musName = `Набор музыки | Трек #${i}`;
            const mPrice = 250 + i * 35;
            items.push({ id: 'mus_' + i, name: musName, category: 'music', value: mPrice, img: this.generateVisual(musName, 'music', mPrice) });
        }

        try {
            localStorage.setItem(this.cacheKey, JSON.stringify(items));
        } catch(e) {}

        return items;
    }
};

let CATALOG_ITEMS = [];
const CASES_DATA = [
    { id: 'archimedes', name: 'Кейс: Архимед', price: 250, items: [] },
    { id: 'tesla', name: 'Кейс: Никола Тесла', price: 1200, items: [] }
];

let currentUser = null;

function defaultUser(steamId, name, avatar) {
    return {
        steamId, username: name, avatar, balance: 2500, tradeUrl: '',
        stats: { upgradesTotal: 0, casesOpened: 0, totalDeposited: 0 },
        bestDrop: { name: '--', value: 0, img: '' },
        inventory: [
            { id: 1, name: 'AK-47 | Красная линия (После полевых испытаний)', value: 1800, img: '' },
            { id: 2, name: 'AWP | Азимов (После полевых испытаний)', value: 7500, img: '' }
        ]
    };
}

function normalizeUser(user, steamId, name, avatar) {
    if (!user || typeof user !== 'object') user = defaultUser(steamId, name, avatar);
    user.steamId = user.steamId || steamId;
    user.username = user.username || name;
    user.avatar = user.avatar || avatar;
    if (typeof user.balance !== 'number') user.balance = 2500;
    if (!user.stats) user.stats = { upgradesTotal: 0, casesOpened: 0, totalDeposited: 0 };
    if (!user.bestDrop) user.bestDrop = { name: '--', value: 0, img: '' };
    if (!Array.isArray(user.inventory)) user.inventory = [];
    
    user.inventory.forEach(item => {
        if (!item.img) item.img = SkinLoader.generateVisual(item.name, 'skins', item.value);
    });
    return user;
}

function saveUserData() {
    if (!currentUser) return;
    localStorage.setItem('zeno_user_' + currentUser.steamId, JSON.stringify(currentUser));
    localStorage.setItem('zeno_current_user', JSON.stringify(currentUser));
}

function loadUserData(steamId, name, avatar) {
    let user = null;
    try {
        const saved = localStorage.getItem('zeno_user_' + steamId);
        if (saved) user = JSON.parse(saved);
    } catch(e) {}
    currentUser = normalizeUser(user, steamId, name, avatar);
    saveUserData();
}

async function initializeApp() {
    CATALOG_ITEMS = await SkinLoader.loadDatabase();
    
    CASES_DATA[0].items = CATALOG_ITEMS.filter(i => i.value >= 100 && i.value <= 4000).slice(0, 20);
    CASES_DATA[1].items = CATALOG_ITEMS.filter(i => i.value > 4000).slice(0, 20);

    try {
        const saved = localStorage.getItem('zeno_current_user');
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.steamId) loadUserData(parsed.steamId, parsed.username, parsed.avatar);
        }
    } catch(e) {}

    if (!currentUser) currentUser = normalizeUser(null, 'default_76561198', 'Гость', '');
    saveUserData();

    document.getElementById('loadingScreen').style.opacity = '0';
    setTimeout(() => document.getElementById('loadingScreen').style.display = 'none', 500);

    renderQuickChances();
    updateHeaderAvatar();
    switchMainTab('upgrade');
}

function logoutSteam() {
    localStorage.removeItem('zeno_current_user');
    currentUser = defaultUser('guest', 'Гость', '');
    updateHeaderAvatar();
    switchMainTab('profile');
}

function updateHeaderAvatar() {
    const box = document.getElementById('headerAvatarContainer');
    if (!box) return;
    box.innerHTML = currentUser && currentUser.avatar ? `<img src="${currentUser.avatar}" alt="Avatar">` : '<div style="width:100%;height:100%;background:#333;"></div>';
}

function switchMainTab(tab) {
    ['navUpgrade', 'navCases', 'navProfile'].forEach(id => document.getElementById(id).classList.remove('active'));
    ['tabUpgradeContent', 'tabCasesContent', 'tabProfileContent'].forEach(id => document.getElementById(id).classList.remove('active'));

    if (tab === 'upgrade') {
        document.getElementById('navUpgrade').classList.add('active');
        document.getElementById('tabUpgradeContent').classList.add('active');
        renderGrid();
        updateUI();
    } else if (tab === 'cases') {
        document.getElementById('navCases').classList.add('active');
        document.getElementById('tabCasesContent').classList.add('active');
        renderCasesList();
    } else {
        document.getElementById('navProfile').classList.add('active');
        document.getElementById('tabProfileContent').classList.add('active');
        renderProfile();
    }
}

let currentTab = 'inventory';
function switchCatalogTab(tabName) {
    currentTab = tabName;
    ['tabInventory', 'tabCatalogSkins', 'tabCatalogStickers', 'tabCatalogMusic'].forEach(id => document.getElementById(id).classList.remove('active'));
    if (tabName === 'inventory') document.getElementById('tabInventory').classList.add('active');
    if (tabName === 'skins') document.getElementById('tabCatalogSkins').classList.add('active');
    if (tabName === 'stickers') document.getElementById('tabCatalogStickers').classList.add('active');
    if (tabName === 'music') document.getElementById('tabCatalogMusic').classList.add('active');
    renderGrid();
}

function renderProfile() {
    const area = document.getElementById('profileContentArea');
    if (!area) return;

    const stats = currentUser.stats;
    const best = currentUser.bestDrop;

    area.innerHTML = `
    <div class="profile-main-card">
    <div class="profile-top-row">
    <div class="profile-username">${currentUser.username}</div>
    <div class="profile-actions-top"><span onclick="logoutSteam()" style="color:#f87171;">Выйти</span></div>
    </div>
    <div class="profile-center-row">
    <div class="profile-avatar-large"><img src="${currentUser.avatar}" alt="Avatar" onerror="this.style.display='none'"></div>
    </div>
    <div class="stats-grid">
    <div class="stat-card"><div class="stat-title">Апгрейды</div><div class="stat-value">${stats.upgradesTotal}</div></div>
    <div class="stat-card"><div class="stat-title">Кейсы</div><div class="stat-value">${stats.casesOpened}</div></div>
    <div class="stat-card"><div class="stat-title">Депозит</div><div class="stat-value">${stats.totalDeposited} ₽</div></div>
    </div>
    <div class="profile-balance-row">
    <div class="balance-info">
    <div class="balance-amount">${Number(currentUser.balance).toFixed(2)} ₽</div>
    <div class="balance-history" onclick="alert('История пуста')">История</div>
    </div>
    <button class="topup-btn" onclick="topUpBalance()">Пополнить</button>
    </div>
    </div>

    <div class="best-drop-card">
    <div class="best-drop-title">Лучший дроп</div>
    <div class="best-drop-content">
    <div class="best-drop-info">
    <div class="best-drop-name">${best.name}</div>
    <div class="best-drop-price">${best.value > 0 ? best.value + ' ₽' : '--'}</div>
    </div>
    ${best.img ? `<img src="${best.img}" class="best-drop-img" alt="">` : ''}
    </div>
    </div>

    <div class="profile-inventory-box">
    <div style="font-size:13px;font-weight:900;color:#fff;text-transform:uppercase;">Инвентарь (${currentUser.inventory.length})</div>
    <div class="items-grid" id="profileItemsGrid" style="max-height:250px;"></div>
    </div>`;
    
    renderProfileInventory();
}

function topUpBalance() {
    currentUser.balance += 1000;
    currentUser.stats.totalDeposited += 1000;
    saveUserData();
    renderProfile();
    updateHeaderAvatar();
    alert('Баланс пополнен на 1,000 ₽!');
}

function renderProfileInventory() {
    const grid = document.getElementById('profileItemsGrid');
    if (!grid) return;
    grid.innerHTML = '';
    currentUser.inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `<img src="${item.img}" alt=""><div class="iname">${item.name}</div><div class="iprice">${item.value} ₽</div>`;
        grid.appendChild(card);
    });
}

let activeCase = null, isCaseSpinning = false, currentWonItem = null;

function renderCasesList() {
    const grid = document.getElementById('casesGrid');
    if (!grid) return;
    grid.innerHTML = '';
    CASES_DATA.forEach(c => {
        const card = document.createElement('div');
        card.className = 'case-card';
        card.innerHTML = `<div class="case-title">${c.name}</div><div class="case-price">${c.price} ₽</div>`;
        card.onclick = () => openCaseScreen(c);
        grid.appendChild(card);
    });
}

function openCaseScreen(c) {
    activeCase = c;
    document.getElementById('casesListContainer').style.display = 'none';
    document.getElementById('caseOpeningView').classList.add('active');
    document.getElementById('activeCaseTitle').textContent = c.name;
    renderCaseContents();
    renderTrack();
    document.getElementById('actionButtons').style.display = 'none';
    document.getElementById('mainOpenBtn').style.display = 'block';
}

function closeCaseOpening() {
    if (isCaseSpinning) return;
    document.getElementById('caseOpeningView').classList.remove('active');
    document.getElementById('casesListContainer').style.display = 'flex';
}

function renderCaseContents() {
    const grid = document.getElementById('caseContentsGrid');
    if (!grid || !activeCase) return;
    grid.innerHTML = '';
    activeCase.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `<img src="${item.img}" alt=""><div class="iname">${item.name}</div><div class="iprice">${item.value} ₽</div>`;
        grid.appendChild(card);
    });
}

const track = document.getElementById('rouletteTrack');
function renderTrack() {
    if (!activeCase) return;
    let html = '';
    for (let i = 0; i < 8; i++) {
        activeCase.items.forEach(item => {
            html += `<div class="roulette-item"><img src="${item.img}" style="width:75px;height:50px;object-fit:contain;" alt=""><strong>${item.name}</strong><span>${item.value} ₽</span></div>`;
        });
    }
    track.innerHTML = html;
}

function startOpening() {
    if (isCaseSpinning || !activeCase) return;
    if (currentUser.balance < activeCase.price) {
        alert('Недостаточно средств!');
        return;
    }
    currentUser.balance -= activeCase.price;
    currentUser.stats.casesOpened++;
    saveUserData();
    isCaseSpinning = true;

    document.getElementById('mainOpenBtn').style.display = 'none';
    track.style.transition = 'none';
    track.style.transform = 'translate3d(0,0,0)';

    const randIdx = Math.floor(Math.random() * activeCase.items.length);
    currentWonItem = activeCase.items[randIdx];

    setTimeout(() => {
        track.style.transition = 'transform 4s cubic-bezier(0.15,0.85,0.35,1)';
        track.style.transform = `translate3d(-${4 * activeCase.items.length * 110 + randIdx * 110 - 150}px,0,0)`;
    }, 50);

    setTimeout(() => {
        isCaseSpinning = false;
        document.getElementById('sellBtn').textContent = `Продать за ${currentWonItem.value} ₽`;
        document.getElementById('actionButtons').style.display = 'flex';
        currentUser.inventory.push(currentWonItem);
        if(currentWonItem.value > currentUser.bestDrop.value) currentUser.bestDrop = {...currentWonItem};
        saveUserData();
    }, 4200);
}

function sellCurrentItem() {
    if (!currentWonItem) return;
    currentUser.balance += currentWonItem.value;
    saveUserData();
    document.getElementById('actionButtons').style.display = 'none';
    document.getElementById('mainOpenBtn').style.display = 'block';
    currentWonItem = null;
}

let selectedItemIndex = null, targetWeapon = null, isSpinning = false, currentRotation = 0, activeQuickChance = null;
let quickChances = [10, 20, 30, 40, 50, 70];
const MAX_CHANCE = 70;

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

function renderQuickChances() {
    const panel = document.getElementById('quickChancePanel');
    panel.innerHTML = '';
    quickChances.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = `q-btn ${activeQuickChance === ch ? 'active' : ''}`;
        btn.textContent = ch + '%';
        btn.onclick = () => applyChance(ch);
        panel.appendChild(btn);
    });
    const sBtn = document.createElement('button');
    sBtn.className = 'q-btn settings-btn';
    sBtn.textContent = '⚙';
    sBtn.onclick = () => document.getElementById('modalOverlay').style.display = 'flex';
    panel.appendChild(sBtn);
}

function applyChance(targetChance) {
    if (selectedItemIndex === null || !currentUser.inventory[selectedItemIndex]) {
        alert('Выберите скин из инвентаря!');
        return;
    }
    const sourcePrice = currentUser.inventory[selectedItemIndex].value;
    const desiredPrice = sourcePrice / (targetChance / 100);
    let best = null, minDiff = Infinity;

    CATALOG_ITEMS.forEach(i => {
        if (i.value <= sourcePrice) return;
        const diff = Math.abs(i.value - desiredPrice);
        if (diff < minDiff) { minDiff = diff; best = i; }
    });

    if (best) {
        targetWeapon = best;
        activeQuickChance = targetChance;
        renderQuickChances();
        renderGrid();
        updateUI();
    }
}

function drawWheel(percent) {
    const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2, r = w/2 - 10;
    ctx.clearRect(0,0,w,h);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.fillStyle = '#161924'; ctx.fill();

    if (percent > 0) {
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + (percent/100)*2*Math.PI);
        ctx.closePath();
        ctx.fillStyle = '#f59e0b'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, r - 26, 0, 2*Math.PI); ctx.fillStyle = '#11131c'; ctx.fill();
}

function updateUI() {
    let sourcePrice = 0;
    if (selectedItemIndex !== null && currentUser.inventory[selectedItemIndex]) {
        const item = currentUser.inventory[selectedItemIndex];
        sourcePrice = item.value;
        document.getElementById('selectedSkinName').textContent = item.name;
        document.getElementById('selectedSkinPrice').textContent = item.value.toFixed(2);
        document.getElementById('selectedSkinImg').src = item.img;
        document.getElementById('selectedSkinImg').style.display = 'block';
        document.getElementById('selectedSkinPlaceholder').style.display = 'none';
    } else {
        document.getElementById('selectedSkinName').textContent = '--';
        document.getElementById('selectedSkinPrice').textContent = '0.00';
        document.getElementById('selectedSkinImg').style.display = 'none';
        document.getElementById('selectedSkinPlaceholder').style.display = 'block';
    }

    let targetPrice = targetWeapon ? targetWeapon.value : 0;
    if (targetWeapon) {
        document.getElementById('targetSkinName').textContent = targetWeapon.name;
        document.getElementById('targetSkinPrice').textContent = targetWeapon.value.toFixed(2);
        document.getElementById('targetSkinImg').src = targetWeapon.img;
        document.getElementById('targetSkinImg').style.display = 'block';
        document.getElementById('targetSkinPlaceholder').style.display = 'none';
    } else {
        document.getElementById('targetSkinName').textContent = '--';
        document.getElementById('targetSkinPrice').textContent = '0.00';
        document.getElementById('targetSkinImg').style.display = 'none';
        document.getElementById('targetSkinPlaceholder').style.display = 'block';
    }

    let chance = 0;
    if (sourcePrice > 0 && targetPrice > sourcePrice) {
        chance = activeQuickChance !== null ? activeQuickChance : Math.min(sourcePrice / targetPrice * 100, MAX_CHANCE);
    }

    document.getElementById('wheelPercent').textContent = chance.toFixed(2) + '%';
    drawWheel(chance);
    document.getElementById('upgradeBtn').disabled = !(sourcePrice > 0 && targetPrice > sourcePrice && chance > 0 && chance <= MAX_CHANCE) || isSpinning;
}

function renderGrid() {
    const grid = document.getElementById('itemsGrid');
    if (!grid) return;
    grid.innerHTML = '';

    if (currentTab === 'inventory') {
        document.getElementById('priceFilterBox').classList.remove('active');
        currentUser.inventory.forEach((item, index) => {
            const card = createCard(item, selectedItemIndex === index, () => {
                if (isSpinning) return;
                selectedItemIndex = selectedItemIndex === index ? null : index;
                activeQuickChance = null;
                renderQuickChances();
                renderGrid();
                updateUI();
            });
            grid.appendChild(card);
        });
    } else {
        document.getElementById('priceFilterBox').classList.add('active');
        const minP = parseFloat(document.getElementById('minPriceInput').value) || 0;
        const maxP = parseFloat(document.getElementById('maxPriceInput').value) || Infinity;

        CATALOG_ITEMS.filter(i => i.category === currentTab && i.value >= minP && i.value <= maxP).forEach(item => {
            const card = createCard(item, targetWeapon && targetWeapon.id === item.id, () => {
                if (isSpinning) return;
                targetWeapon = targetWeapon && targetWeapon.id === item.id ? null : item;
                activeQuickChance = null;
                renderQuickChances();
                renderGrid();
                updateUI();
            });
            grid.appendChild(card);
        });
    }
}

function createCard(item, isSelected, onClick) {
    const card = document.createElement('div');
    card.className = `item-card ${isSelected ? 'selected' : ''}`;
    card.innerHTML = `<img src="${item.img}" alt=""><div class="iname">${item.name}</div><div class="iprice">${item.value} ₽</div>`;
    card.onclick = onClick;
    return card;
}

document.getElementById('upgradeBtn').onclick = () => {
    if (isSpinning || selectedItemIndex === null || !targetWeapon) return;
    isSpinning = true;
    document.getElementById('upgradeBtn').disabled = true;
    document.getElementById('wheelOverlay').style.display = 'block';

    const sourcePrice = currentUser.inventory[selectedItemIndex].value;
    const chance = activeQuickChance !== null ? activeQuickChance : Math.min((sourcePrice / targetWeapon.value) * 100, MAX_CHANCE);
    const isSuccess = Math.random() * 100 < chance;

    currentUser.stats.upgradesTotal++;
    saveUserData();

    currentRotation += 360 * 5 + (isSuccess ? 45 : 200);
    canvas.style.transition = 'transform 3.5s cubic-bezier(0.15,0.85,0.35,1)';
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
        document.getElementById('resultOverlay').style.display = 'flex';
        document.getElementById('resultText').textContent = isSuccess ? 'Успех!' : 'Неудача';
        document.getElementById('resultText').style.color = isSuccess ? '#4ade80' : '#f87171';

        currentUser.inventory.splice(selectedItemIndex, 1);
        if (isSuccess) {
            currentUser.inventory.push({...targetWeapon});
            if (targetWeapon.value > currentUser.bestDrop.value) currentUser.bestDrop = {...targetWeapon};
        }
        saveUserData();

        setTimeout(() => {
            document.getElementById('resultOverlay').style.display = 'none';
            document.getElementById('wheelOverlay').style.display = 'none';
            isSpinning = false;
            selectedItemIndex = null;
            targetWeapon = null;
            activeQuickChance = null;
            renderQuickChances();
            renderGrid();
            updateUI();
        }, 2000);
    }, 3600);
};

window.onload = initializeApp;
</script>

</body>
</html>
