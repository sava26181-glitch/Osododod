<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zenodrop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#0d0f17;
    font-family:'Segoe UI',Roboto,sans-serif;
    color:#d1d5db;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    overflow-x:hidden
}

.container{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:16px
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 4px
}

.logo-area{
    font-weight:900;
    font-size:18px;
    color:#fff;
    text-transform:uppercase;
    letter-spacing:1.5px;
    text-shadow:0 0 15px rgba(245,158,11,.4)
}

.logo-area span{color:#f59e0b}

.profile-avatar-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#161924;
    border:2px solid rgba(245,158,11,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden
}

.profile-avatar-btn img{
    width:100%;
    height:100%;
    object-fit:cover
}

.main-nav{
    display:flex;
    gap:8px;
    background:#161924;
    padding:4px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.06)
}

.main-tab{
    flex:1;
    background:transparent;
    border:none;
    color:#9ca3af;
    padding:10px 0;
    border-radius:8px;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    text-transform:uppercase
}

.main-tab.active{
    background:#f59e0b;
    color:#11131c;
    box-shadow:0 0 15px rgba(245,158,11,.3)
}

.tab-content{
    display:none;
    flex-direction:column;
    gap:16px;
    width:100%
}

.tab-content.active{display:flex}

.zeno-layout{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:100%
}

.wheel-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    width:100%
}

.wheel-wrapper{
    position:relative;
    width:220px;
    height:220px;
    filter:drop-shadow(0 0 20px rgba(0,0,0,.6))
}

.wheel-pointer{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:16px solid #fbbf24;
    z-index:20
}

.wheel-canvas-box{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,.8);
    background:#161924
}

.wheel-wrapper canvas{
    width:100%;
    height:100%;
    display:block;
    transform-origin:center center
}

.wheel-center-content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    pointer-events:none;
    z-index:5
}

.wheel-percent{
    font-size:26px;
    font-weight:900;
    color:#4ade80;
    line-height:1
}

.wheel-chance-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#9ca3af;
    margin-top:4px
}

#resultOverlay{
    position:absolute;
    inset:0;
    background:rgba(11,13,20,.86);
    border-radius:50%;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:15;
    flex-direction:column
}

#resultText{
    font-size:22px;
    font-weight:900;
    text-transform:uppercase
}

.btn-upgrade{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    border:none;
    color:#11131c;
    padding:14px 0;
    width:100%;
    border-radius:14px;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:1px;
    box-shadow:0 4px 20px rgba(245,158,11,.4)
}

.btn-upgrade:disabled{
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none
}

.quick-chance-panel{
    display:flex;
    gap:6px;
    width:100%;
    justify-content:center;
    flex-wrap:wrap
}

.q-btn{
    background:#161924;
    border:1px solid rgba(255,255,255,.08);
    color:#d1d5db;
    padding:6px 12px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    cursor:pointer
}

.q-btn.active{
    border-color:#f59e0b;
    color:#f59e0b;
    background:rgba(245,158,11,.05)
}

.q-btn.settings-btn{
    background:rgba(245,158,11,.1);
    border-color:rgba(245,158,11,.3);
    color:#f59e0b
}

.skins-selection-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%
}

.card-skin{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    min-height:180px;
    justify-content:space-between;
    overflow:hidden
}

.skin-type{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#9ca3af
}

.skin-name{
    font-size:13px;
    font-weight:800;
    color:#fff;
    margin:2px 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%
}

.skin-img-wrap{
    width:100%;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden
}

.skin-img-wrap img{
    max-width:100%;
    max-height:70px;
    object-fit:contain;
    filter:drop-shadow(0 5px 10px rgba(0,0,0,.8))
}

.skin-price{
    font-size:14px;
    font-weight:800;
    color:#fbbf24
}

.inventory-section{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px
}

.inv-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px
}

.inv-tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap
}

.inv-tab{
    background:#11131c;
    border:1px solid rgba(255,255,255,.06);
    color:#9ca3af;
    padding:6px 10px;
    border-radius:8px;
    font-weight:700;
    font-size:11px;
    cursor:pointer
}

.inv-tab.active{
    background:#f59e0b;
    color:#11131c;
    border-color:#f59e0b
}

.price-filter-box{
    display:none;
    gap:6px;
    align-items:center
}

.price-filter-box.active{display:flex}

.price-input{
    background:#11131c;
    border:1px solid rgba(255,255,255,.1);
    border-radius:6px;
    color:#fff;
    padding:4px 8px;
    width:75px;
    font-size:11px;
    outline:none
}

.items-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:8px;
    max-height:220px;
    overflow-y:auto;
    padding-right:4px
}

.item-card{
    background:#11131c;
    border:1px solid rgba(255,255,255,.06);
    border-radius:10px;
    padding:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    overflow:hidden
}

.item-card:hover{
    border-color:rgba(245,158,11,.4);
    transform:translateY(-2px)
}

.item-card.selected{
    border-color:#f59e0b;
    box-shadow:0 0 10px rgba(245,158,11,.2)
}

.item-card img{
    width:75px;
    height:50px;
    object-fit:contain;
    margin:4px 0;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))
}

.item-card .iname{
    font-size:10px;
    font-weight:700;
    color:#d1d5db;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%
}

.item-card .iprice{
    font-size:11px;
    font-weight:800;
    color:#fbbf24;
    margin-top:3px
}

.cases-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    width:100%
}

.case-card{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    cursor:pointer;
    transition:.3s
}

.case-card:hover{
    border-color:#f59e0b;
    transform:translateY(-3px)
}

.case-card img{
    width:130px;
    height:85px;
    object-fit:contain;
    margin-bottom:6px;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.7))
}

.case-title{
    font-size:13px;
    font-weight:800;
    color:#fff;
    margin-bottom:4px
}

.case-price{
    font-size:13px;
    font-weight:800;
    color:#fbbf24
}

.case-opening-view{
    display:none;
    flex-direction:column;
    gap:16px;
    width:100%;
    align-items:center
}

.case-opening-view.active{display:flex}

.back-cases-btn{
    align-self:flex-start;
    background:#161924;
    border:1px solid rgba(255,255,255,.08);
    color:#9ca3af;
    padding:6px 12px;
    border-radius:8px;
    font-weight:700;
    font-size:12px;
    cursor:pointer
}

.roulette-container{
    position:relative;
    overflow:hidden;
    width:100%;
    height:120px;
    background:#151518;
    border-radius:12px;
    border:1px solid #2a2a2e
}

.roulette-track{
    display:flex;
    gap:10px;
    position:absolute;
    left:0;
    top:0;
    height:100%;
    will-change:transform
}

.roulette-item{
    width:100px;
    min-width:100px;
    height:100%;
    background:#1a1a1e;
    border:1px solid #2f2f35;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:11px;
    position:relative;
    overflow:hidden
}

.roulette-item img{
    width:75px;
    height:50px;
    object-fit:contain
}

.roulette-item strong{
    max-width:92px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.roulette-pointer{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:3px;
    transform:translateX(-50%);
    background:#ffb800;
    z-index:20
}

.action-buttons{
    display:none;
    gap:10px;
    width:100%
}

.action-btn{
    flex:1;
    padding:12px 10px;
    border-radius:12px;
    font-weight:900;
    cursor:pointer;
    font-size:14px;
    border:none;
    text-transform:uppercase
}

.sell-btn{
    background:#2a2a2e;
    color:#ffb800;
    border:1px solid #ffb800
}

.retry-btn{
    background:linear-gradient(135deg,#ffb800,#ff8c00);
    color:#000
}

.profile-wrapper{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%
}

.profile-main-card{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px
}

.profile-top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    font-weight:700;
    color:#9ca3af
}

.profile-username{
    color:#fff;
    font-weight:800;
    font-size:14px
}

.profile-center-row{
    display:flex;
    align-items:center;
    justify-content:center
}

.profile-avatar-large{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#000;
    border:2px solid rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden
}

.profile-avatar-large img{
    width:100%;
    height:100%;
    object-fit:cover
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px
}

.stat-box{
    background:#11131c;
    border:1px solid rgba(255,255,255,.05);
    border-radius:10px;
    padding:10px 5px;
    text-align:center
}

.stat-value{
    color:#fff;
    font-size:17px;
    font-weight:900
}

.stat-label{
    color:#6b7280;
    font-size:9px;
    text-transform:uppercase;
    margin-top:3px
}

.profile-balance-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#11131c;
    padding:12px;
    border-radius:12px
}

.balance-amount{
    color:#fbbf24;
    font-size:19px;
    font-weight:900
}

.balance-history{
    color:#6b7280;
    font-size:10px;
    margin-top:2px
}

.topup-btn{
    background:#f59e0b;
    color:#11131c;
    border:0;
    border-radius:8px;
    padding:9px 13px;
    font-weight:900;
    cursor:pointer
}

.best-drop-card{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:16px
}

.best-drop-title{
    font-size:11px;
    color:#9ca3af;
    text-transform:uppercase;
    font-weight:800;
    margin-bottom:10px
}

.best-drop-content{
    display:flex;
    justify-content:space-between;
    align-items:center
}

.best-drop-name{
    color:#fff;
    font-size:13px;
    font-weight:800
}

.best-drop-price{
    color:#fbbf24;
    font-size:14px;
    font-weight:900;
    margin-top:5px
}

.best-drop-img{
    width:100px;
    height:60px;
    object-fit:contain
}

.profile-inventory-box{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid rgba(255,255,255,.06);
    border-radius:16px;
    padding:16px
}

.loading{
    position:fixed;
    inset:0;
    background:#0d0f17;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    flex-direction:column;
    gap:12px
}

.loading-logo{
    font-size:25px;
    font-weight:900;
    color:#fff
}

.loading-logo span{color:#f59e0b}

.loading-text{
    color:#6b7280;
    font-size:12px
}

.loader{
    width:30px;
    height:30px;
    border:3px solid #252936;
    border-top-color:#f59e0b;
    border-radius:50%;
    animation:spin .7s linear infinite
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
    padding:20px
}

.modal{
    width:100%;
    max-width:380px;
    background:#161924;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    padding:20px
}

.modal h3{
    color:#fff;
    margin-bottom:12px
}

.modal p{
    color:#9ca3af;
    font-size:12px;
    margin-bottom:12px
}

.modal input{
    width:100%;
    background:#11131c;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    border-radius:9px;
    padding:11px;
    outline:none;
    margin-bottom:12px
}

.modal-buttons{
    display:flex;
    gap:8px
}

.modal-buttons button{
    flex:1;
    padding:10px;
    border-radius:9px;
    border:0;
    font-weight:800;
    cursor:pointer
}

.modal-save{
    background:#f59e0b
}

.modal-close{
    background:#252936;
    color:#fff
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#6b7280;
    padding:20px;
    font-size:12px
}

@media(max-width:380px){
    .items-grid{
        grid-template-columns:repeat(2,1fr)
    }

    .wheel-wrapper{
        width:200px;
        height:200px
    }
}
</style>
</head>

<body>

<div class="loading" id="loading">
    <div class="loading-logo">ZENO<span>DROP</span></div>
    <div class="loader"></div>
    <div class="loading-text" id="loadingText">Загрузка CS2 предметов...</div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3>Настройка быстрых шансов</h3>
        <p>Укажи проценты через запятую. Например: 10,20,30,40,50,70</p>
        <input id="quickValuesInput" value="10,20,30,40,50,70">
        <div class="modal-buttons">
            <button class="modal-close" onclick="closeSettings()">Отмена</button>
            <button class="modal-save" onclick="saveQuickSettings()">Сохранить</button>
        </div>
    </div>
</div>

<div class="container">

<header class="header">
    <div class="logo-area">ZENO<span>DROP</span></div>

    <button class="profile-avatar-btn" onclick="switchMainTab('profile')">
        <img id="headerAvatar"
             src="https://avatars.steamstatic.com/0000000000000000000000000000000000000000_full.jpg"
             onerror="this.style.display='none'">
    </button>
</header>

<nav class="main-nav">
    <button class="main-tab active" data-tab="upgrade">Апгрейд</button>
    <button class="main-tab" data-tab="cases">Кейсы</button>
    <button class="main-tab" data-tab="profile">Профиль</button>
</nav>

<!-- ================= UPGRADE ================= -->

<section class="tab-content active" id="upgradeTab">

<div class="zeno-layout">

<div class="wheel-container">

<div class="wheel-wrapper">

<div class="wheel-pointer"></div>

<div class="wheel-canvas-box">

<canvas id="wheelCanvas" width="440" height="440"></canvas>

<div class="wheel-center-content">
<div class="wheel-percent" id="wheelPercent">0.00%</div>
<div class="wheel-chance-label">Шанс</div>
</div>

<div id="resultOverlay">
<div id="resultText"></div>
</div>

</div>
</div>

<div class="quick-chance-panel" id="quickChancePanel"></div>

<button class="btn-upgrade" id="upgradeBtn" disabled>
АПГРЕЙД
</button>

</div>

<div class="skins-selection-row">

<div class="card-skin">

<div class="skin-type">Ваш скин</div>

<div class="skin-img-wrap">
<img id="selectedSkinImg" style="display:none">
<span id="selectedSkinPlaceholder">Выберите</span>
</div>

<div class="skin-name" id="selectedSkinName">--</div>

<div class="skin-price">
<span id="selectedSkinPrice">0.00</span> ₽
</div>

</div>

<div class="card-skin">

<div class="skin-type">Цель</div>

<div class="skin-img-wrap">
<img id="targetSkinImg" style="display:none">
<span id="targetSkinPlaceholder">Выберите</span>
</div>

<div class="skin-name" id="targetSkinName">--</div>

<div class="skin-price">
<span id="targetSkinPrice">0.00</span> ₽
</div>

</div>

</div>

<div class="inventory-section">

<div class="inv-header-row">

<div class="inv-tabs">

<button class="inv-tab active" data-inv-tab="inventory">
Инвентарь
</button>

<button class="inv-tab" data-inv-tab="pistols">
Пистолеты
</button>

<button class="inv-tab" data-inv-tab="rifles">
Винтовки
</button>

<button class="inv-tab" data-inv-tab="snipers">
AWP/Снайперы
</button>

</div>

<div class="price-filter-box" id="priceFilterBox">

<input class="price-input" id="minPriceInput" type="number" placeholder="от">

<input class="price-input" id="maxPriceInput" type="number" placeholder="до">

</div>

</div>

<div class="items-grid" id="itemsGrid"></div>

</div>

</div>

</section>

<!-- ================= CASES ================= -->

<section class="tab-content" id="casesTab">

<div id="casesListContainer">

<div class="cases-grid" id="casesGrid"></div>

</div>

<div class="case-opening-view" id="caseOpeningView">

<button class="back-cases-btn" onclick="closeCaseOpening()">
← Назад
</button>

<h3 id="activeCaseTitle" style="color:#fff"></h3>

<div class="roulette-container">

<div class="roulette-pointer"></div>

<div class="roulette-track" id="rouletteTrack"></div>

</div>

<div class="inventory-section" style="width:100%">

<div style="font-size:13px;font-weight:900;color:#fff">
Содержимое кейса
</div>

<div class="items-grid" id="caseContentsGrid"></div>

</div>

<button class="btn-upgrade" id="mainOpenBtn" onclick="startOpening()">
ОТКРЫТЬ КЕЙС
</button>

<div class="action-buttons" id="actionButtons">

<button class="action-btn sell-btn" id="sellBtn" onclick="sellCurrentItem()">
ПРОДАТЬ
</button>

<button class="action-btn retry-btn" onclick="startOpening()">
ЕЩЁ РАЗ
</button>

</div>

</div>

</section>

function escapeHtml(value){

    return String(value??'')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

function formatPrice(value){

/* =========================================================
   PRICE
   ========================================================= */

function normalizeSteamPrice(value){

    if(typeof value==='number'){

        if(value>100000)
            return value/100;

        return value;

    }

    if(!value)
        return 0;

    let s=String(value)
        .replace(/[^\d,.]/g,'');

    s=s.replace(/\s/g,'');

    if(s.includes(',') && s.includes('.')){

        if(s.lastIndexOf(',')>
           s.lastIndexOf('.')){

            s=s.replace(/\./g,'')
               .replace(',','.');

        }else{

            s=s.replace(/,/g,'');

        }

    }else{

        s=s.replace(',','.');

    }

    return Number(s)||0;

}


/*
  Получаем список предметов Steam Market.
  Используем несколько страниц, чтобы не делать
  отдельный запрос на каждый скин.
*/

async function loadSteamPrices(){

    document.getElementById('loadingText').textContent=
        'Получение реальных цен Steam Market...';

    const prices=new Map();

    const pages=[
        0,
        100,
        200,
        300,
        400
    ];

    for(const start of pages){

        try{

            const url=
                STEAM_SEARCH+
                '?query='+
                '&start='+start+
                '&count=100'+
                '&search_descriptions=0'+
                '&sort_column=price'+
                '&sort_dir=asc'+
                '&appid=730'+
                '&norender=1'+
                '&currency=5';

            const data=
                await fetchSteamJSON(url);

            const results=
                data?.results||
                data?.items||
                [];

            for(const item of results){

                const name=
                    item.hash_name||
                    item.market_hash_name||
                    item.name;

                const raw=
                    item.sell_price_value||
                    item.sell_price||
                    item.price;

                const price=
                    normalizeSteamPrice(raw);

                if(name && price>0){

                    prices.set(name,price);

                }

            }

        }catch(e){

            console.warn(
                'Steam page failed',
                start,
                e
            );

        }

        await sleep(250);

    }

    return prices;

}


/*
  Запрос конкретного предмета как fallback.
*/

async function fetchSingleSteamPrice(name){

    try{

        const url=
            STEAM_PRICE+
            '?appid=730'+
            '&currency=5'+
            '&market_hash_name='+
            encodeURIComponent(name);

        const data=
            await fetchSteamJSON(url);

        if(!data?.success)
            return 0;

        if(data.lowest_price_value){

            return normalizeSteamPrice(
                data.lowest_price_value
            );

        }

        if(data.lowest_price){

            return normalizeSteamPrice(
                data.lowest_price
            );

        }

    }catch(e){}

    return 0;

}

function getCategory(item){

    const weapon=
        String(item.weapon?.name||'').toLowerCase();

    if(
        weapon.includes('awp')||
        weapon.includes('ssg')||
        weapon.includes('scar')||
        weapon.includes('g3sg1')||
        weapon.includes('scout')
    ){

        return 'snipers';

    }

    if(
        weapon.includes('ak-47')||
        weapon.includes('m4a')||
        weapon.includes('aug')||
        weapon.includes('famas')||
        weapon.includes('galil')||
        weapon.includes('sg 553')||
        weapon.includes('sg553')||
        weapon.includes('mac-10')||
        weapon.includes('mp9')||
        weapon.includes('mp7')||
        weapon.includes('ump')||
        weapon.includes('p90')||
        weapon.includes('pp-bizon')
    ){

        return 'rifles';

    }

    return 'pistols';

}


async function buildCatalog(skins){

    const prices=
        await loadSteamPrices();

    const map=new Map();

    for(const item of skins){

        if(!item.market_hash_name)
            continue;

        const price=
            prices.get(
                item.market_hash_name
            )||0;

        if(price<=0)
            continue;

        const obj={
            id:item.id,
            name:item.market_hash_name,
            value:price,
            img:item.image||'',
            rarity:item.rarity?.name||'',
            rarityColor:item.rarity?.color||'#777',
            category:getCategory(item)
        };

        map.set(
            item.market_hash_name,
            obj
        );

    }

    /*
      Если Steam search не вернул конкретный предмет,
      пытаемся получить цену отдельно для части каталога.
    */

    const candidates=
        skins
        .filter(x=>
            x.market_hash_name &&
            !map.has(x.market_hash_name)
        )
        .slice(0,180);

    let index=0;

    async function worker(){

        while(index<candidates.length){

            const item=
                candidates[index++];

            const price=
                await fetchSingleSteamPrice(
                    item.market_hash_name
                );

            if(price>0){

                map.set(
                    item.market_hash_name,
                    {
                        id:item.id,
                        name:item.market_hash_name,
                        value:price,
                        img:item.image||'',
                        rarity:item.rarity?.name||'',
                        rarityColor:item.rarity?.color||'#777',
                        category:getCategory(item)
                    }
                );

            }

            await sleep(120);

        }

    }

    await Promise.all([
        worker(),
        worker(),
        worker(),
        worker()
    ]);

    return [...map.values()]
        .sort((a,b)=>a.value-b.value);

}

/*
  Прозрачные независимые вероятности:

  70%  — до 1.5x
  7.998% — 1.5x-2x
  9% — 2x-3x
  7% — 3x-4x
  5% — 4x-5x
  1% — 5x-10x
  0.002% — >10x
*/

function chooseBand(price){

    const r=Math.random()*100;

    if(r<0.002)
        return '10x';

    if(r<1.002)
        return '5x';

    if(r<6.002)
        return '4x';

    if(r<13.002)
        return '3x';

    if(r<22.002)
        return '2x';

    if(r<30)
        return '1.5x';

    return 'low';

}


function pickFromBand(items,band){

    let filtered=[];

    if(band==='10x'){

        filtered=
            items.filter(x=>
                x.value>activeCase.price*10
            );

    }else if(band==='5x'){

        filtered=
            items.filter(x=>
                x.value>activeCase.price*5 &&
                x.value<=activeCase.price*10
            );

    }else if(band==='4x'){

        filtered=
            items.filter(x=>
                x.value>activeCase.price*4 &&
                x.value<=activeCase.price*5
            );

    }else if(band==='3x'){

        filtered=
            items.filter(x=>
                x.value>activeCase.price*3 &&
                x.value<=activeCase.price*4
            );

    }else if(band==='2x'){

        filtered=
            items.filter(x=>
                x.value>activeCase.price*2 &&
                x.value<=activeCase.price*3
            );

    }else if(band==='1.5x'){

        filtered=
            items.filter(x=>
                x.value>activeCase.price*1.5 &&
                x.value<=activeCase.price*2
            );

    }else{

        filtered=
            items.filter(x=>
                x.value<=activeCase.price*1.5
            );

    }

    /*
      Если диапазон пустой, берём ближайший
      доступный предмет. Вероятность не меняется.
    */

    if(!filtered.length){

        filtered=
            [...items]
            .sort((a,b)=>
                Math.abs(a.value-activeCase.price)-
                Math.abs(b.value-activeCase.price)
            )
            .slice(0,20);

    }

    return filtered[
        Math.floor(
            Math.random()*filtered.length
        )
    ];

}


function buildCases(catalog){

    const result=[];

    for(let i=0;i<CASE_PRICES.length;i++){

        const price=CASE_PRICES[i];

        const eligible=
            catalog.filter(x=>
                x.value>0 &&
                x.value<=Math.max(
                    price*10,
                    100
                )
            );

        if(!eligible.length)
            continue;

        const sorted=
            [...catalog]
            .sort((a,b)=>a.value-b.value);

        /*
          Берём предметы для отображения из
          разных ценовых диапазонов.
        */

        const display=[];

        const multipliers=[
            .2,
            .5,
            .8,
            1,
            1.5,
            2,
            3,
            5,
            10
        ];

        for(const multiplier of multipliers){

            const wanted=
                price*multiplier;

            let closest=null;
            let distance=Infinity;

            for(const item of sorted){

                if(item.value<=0)
                    continue;

                const d=
                    Math.abs(item.value-wanted);

                if(d<distance){

                    distance=d;
                    closest=item;

                }

            }

            if(
                closest &&
                !display.some(
                    x=>x.id===closest.id
                )
            ){

                display.push(closest);

            }

        }

        const expensive=
            sorted
            .filter(x=>
                x.value>price*10
            )
            .slice(0,5);

        for(const item of expensive){

            if(
                !display.some(
                    x=>x.id===item.id
                )
            ){

                display.push(item);

            }

        }

        result.push({

            id:'case_'+price,

            name:
                CASE_NAMES[i]||
                'Кейс '+price,

            price,

            items:display.length?
                display:
                eligible.slice(0,20)

        });

    }

    return result;

}

function applyChance(ch){

    if(
        selectedItemIndex===null ||
        !currentUser.inventory[selectedItemIndex]
    ){

        alert(
            'Сначала выберите скин из инвентаря'
        );

        return;

    const source=
        currentUser.inventory[
            selectedItemIndex
        ];

    const desired=
        source.value/(ch/100);

    let best=null;
    let distance=Infinity;

    for(const item of CATALOG_ITEMS){

        if(item.value<=source.value)
            continue;

        const d=
            Math.abs(
                item.value-desired
            );

        if(d<distance){

            distance=d;
            best=item;

        }

    }

    if(!best)
        return;

    targetWeapon=best;

    /*
      Важно:
      30% = ровно 30%.
      Здесь не добавляется скрытый бонус.
    */

    activeQuickChance=ch;

    renderQuickChances();
    renderGrid();
    updateUI();

}

function drawWheel(chance){

    const w=canvas.width;
    const h=canvas.height;

    const cx=w/2;
    const cy=h/2;

    const r=w/2-10;

    ctx.clearRect(
        0,
        0,
        w,
        h
    );

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle='#161924';
    ctx.fill();

    /*
      Успешная зона.
    */

    if(chance>0){

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.arc(
            cx,
            cy,
            r,
            -Math.PI/2,
            -Math.PI/2+
            chance/100*Math.PI*2
        );

        ctx.closePath();

        ctx.fillStyle='#f59e0b';

        ctx.fill();

    }

    /*
      Тёмный центр.
    */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r-55,
        0,
        Math.PI*2
    );

    ctx.fillStyle='#11131c';

    ctx.fill();

}


function updateUI(){

    let sourcePrice=0;

    if(
        selectedItemIndex!==null &&
        currentUser.inventory[selectedItemIndex]
    ){

        const item=
            currentUser.inventory[
                selectedItemIndex
            ];

        sourcePrice=item.value;

        selectedSkinName.textContent=
            item.name;

        selectedSkinPrice.textContent=
            formatPrice(item.value);

        selectedSkinImg.src=item.img;

        selectedSkinImg.style.display='block';

        selectedSkinPlaceholder.style.display='none';

    }else{

        selectedSkinName.textContent='--';
        selectedSkinPrice.textContent='0.00';

        selectedSkinImg.style.display='none';

        selectedSkinPlaceholder.style.display='block';

    }

    const targetPrice=
        targetWeapon?.value||0;

    if(targetWeapon){

        targetSkinName.textContent=
            targetWeapon.name;

        targetSkinPrice.textContent=
            formatPrice(targetWeapon.value);

        targetSkinImg.src=
            targetWeapon.img;

        targetSkinImg.style.display='block';

        targetSkinPlaceholder.style.display='none';

    }else{

        targetSkinName.textContent='--';
        targetSkinPrice.textContent='0.00';

        targetSkinImg.style.display='none';

        targetSkinPlaceholder.style.display='block';

    }

    let chance=0;

    if(
        sourcePrice>0 &&
        targetPrice>sourcePrice
    ){

        chance=
            activeQuickChance!==null?
            activeQuickChance:
            Math.min(
                sourcePrice/
                targetPrice*
                100,
                MAX_CHANCE
            );

    }

    wheelPercent.textContent=
        chance.toFixed(2)+'%';

    wheelPercent.style.color=
        chance>0?
        '#4ade80':
        '#6b7280';

    drawWheel(chance);

    upgradeBtn.disabled=
        !(
            sourcePrice>0 &&
            targetPrice>sourcePrice &&
            chance>0 &&
            chance<=MAX_CHANCE
        )||
        isSpinning;

}


/* =========================================================
   UPGRADE
   ========================================================= */

upgradeBtn.onclick=()=>{

    if(
        isSpinning||
        selectedItemIndex===null||
        !targetWeapon
    )
        return;

    const source=
        currentUser.inventory[
            selectedItemIndex
        ];

    if(!source)
        return;

    const chance=
        activeQuickChance!==null?
        activeQuickChance:
        Math.min(
            source.value/
            targetWeapon.value*
            100,
            MAX_CHANCE
        );

    if(
        chance<=0||
        chance>MAX_CHANCE
    )
        return;

    isSpinning=true;

    upgradeBtn.disabled=true;

    /*
      Обычная независимая случайность.
      Предыдущие победы/проигрыши не влияют
      на следующий результат.
    */

    const success=
        Math.random()*100<chance;

    currentUser.stats.upgradesTotal++;

    /*
      Сектор колеса соответствует фактическому
      результату.
    */

    const sector=
        chance*3.6;

    let angle;

    if(success){

        angle=
            -90+
            sector*
            (.12+Math.random()*.76);

    }else{

        angle=
            -90+
            sector+
            (360-sector)*
            (.12+Math.random()*.76);

    }

    const normalized=
        ((currentRotation%360)+360)%360;

    let delta=
        (-90-angle-normalized)%360;

    if(delta<0)
        delta+=360;

    currentRotation+=
        2160+
        delta;

    canvas.style.transition=
        'transform 3.6s cubic-bezier(.15,.85,.35,1)';

    canvas.style.transform=
        `rotate(${currentRotation}deg)`;

    saveUserData();

    setTimeout(()=>{

        const resultOverlay=
            document.getElementById(
                'resultOverlay'
            );

        const resultText=
            document.getElementById(
                'resultText'
            );

        resultOverlay.style.display=
            'flex';

        resultText.textContent=
            success?
            'Успех!':
            'Неудача';

        resultText.style.color=
            success?
            '#4ade80':
            '#f87171';

        /*
          Исходный предмет удаляется
          независимо от результата.
        */

        const inventoryIndex=
            currentUser.inventory.findIndex(
                x=>x.id===source.id
            );

        if(inventoryIndex>=0){

            currentUser.inventory.splice(
                inventoryIndex,
                1
            );

        }

        if(success){

            const won={
                ...targetWeapon
            };

            currentUser.inventory.push(won);

            if(
                won.value>
                currentUser.bestDrop.value
            ){

                currentUser.bestDrop={
                    ...won
                };

            }

        }

        saveUserData();

        setTimeout(()=>{

            resultOverlay.style.display=
                'none';

            isSpinning=false;

            selectedItemIndex=null;

            targetWeapon=null;

            activeQuickChance=null;

            renderQuickChances();
            renderGrid();
            updateUI();

            canvas.style.transition='none';

            currentRotation=
                ((currentRotation%360)+360)%360;

            canvas.style.transform=
                `rotate(${currentRotation}deg)`;

        },1800);

    },3700);

};


/* =========================================================
   CASES UI
   ========================================================= */

function renderCasesList(){

    const grid=
        document.getElementById(
            'casesGrid'
        );

    grid.innerHTML='';

    CASES_DATA.forEach(c=>{

        const card=
            document.createElement('div');

        card.className='case-card';

        const preview=
            c.items
            .slice()
            .sort(
                (a,b)=>b.value-a.value
            )[0];

        card.innerHTML=`

            ${
                preview?.img?
                `<img
                    src="${escapeAttr(preview.img)}"
                    alt=""
                    loading="lazy"
                >`:
                ''
            }

            <div class="case-title">
                ${escapeHtml(c.name)}
            </div>

            <div class="case-price">
                ${formatPrice(c.price)} ₽
            </div>

        `;

        card.onclick=()=>openCaseScreen(c);

        grid.appendChild(card);

    });

}


function openCaseScreen(c){

    activeCase=c;

    document.getElementById(
        'casesListContainer'
    ).style.display='none';

    document.getElementById(
        'caseOpeningView'
    ).classList.add('active');

    document.getElementById(
        'activeCaseTitle'
    ).textContent=
        c.name+
        ' · '+
        formatPrice(c.price)+
        ' ₽';

    document.getElementById(
        'actionButtons'
    ).style.display='none';

    document.getElementById(
        'mainOpenBtn'
    ).style.display='block';

    renderCaseContents();
    renderTrack();

}


function closeCaseOpening(){

    if(isCaseSpinning)
        return;

    document.getElementById(
        'caseOpeningView'
    ).classList.remove('active');

    document.getElementById(
        'casesListContainer'
    ).style.display='block';

}


function renderCaseContents(){

    const grid=
        document.getElementById(
            'caseContentsGrid'
        );

    grid.innerHTML='';

    if(!activeCase)
        return;

    activeCase.items
        .slice()
        .sort((a,b)=>a.value-b.value)
        .forEach(item=>{

            grid.appendChild(
                createCard(
                    item,
                    false,
                    ()=>{}
                )
            );

        });

}


function renderTrack(){

    if(!activeCase)
        return;

    let html='';

    /*
      Длинная лента.
    */

    for(let i=0;i<10;i++){

        activeCase.items.forEach(item=>{

            html+=`

                <div class="roulette-item">

                    <img
                        src="${escapeAttr(item.img)}"
                        alt=""
                    >

                    <strong>
                        ${escapeHtml(item.name)}
                    </strong>

                    <span>
                        ${formatPrice(item.value)} ₽
                    </span>

                </div>

            `;

        });

    }

    track.innerHTML=html;

    track.style.transform=
        'translate3d(0,0,0)';

}


/* =========================================================
   CASE OPEN
   ========================================================= */

function startOpening(){

    if(
        isCaseSpinning||
        !activeCase
    )
        return;

    if(
        currentUser.balance<
        activeCase.price
    ){

        alert(
            'Недостаточно средств!'
        );

        return;

    }

    currentUser.balance-=
        activeCase.price;

    currentUser.stats.casesOpened++;

    saveUserData();

    isCaseSpinning=true;

    document.getElementById(
        'mainOpenBtn'
    ).style.display='none';

    document.getElementById(
        'actionButtons'
    ).style.display='none';

    track.style.transition='none';

    track.style.transform=
        'translate3d(0,0,0)';

    /*
      Выбираем диапазон.
      Результат не зависит от предыдущих открытий.
    */

    const band=
        chooseBand(
            activeCase.price
        );

    currentWonItem=
        pickFromBand(
            activeCase.items,
            band
        );

    if(!currentWonItem){

        currentWonItem=
            activeCase.items[
                Math.floor(
                    Math.random()*
                    activeCase.items.length
                )
            ];

    }

    /*
      Находим предмет в ленте.
    */

    const itemIndex=
        activeCase.items.findIndex(
            x=>x.id===currentWonItem.id
        );

    const count=
        activeCase.items.length;

    const step=110;

    const cycle=6;

    const center=190;

    const finalPosition=
        cycle*
        count*
        step+
        itemIndex*
        step-
        center;

    setTimeout(()=>{

        track.style.transition=
            'transform 4s cubic-bezier(.15,.85,.35,1)';

        track.style.transform=
            `translate3d(-${finalPosition}px,0,0)`;

    },50);


    setTimeout(()=>{

        isCaseSpinning=false;

        document.getElementById(
            'sellBtn'
        ).textContent=
            'Продать за '+
            formatPrice(
                currentWonItem.value
            )+
            ' ₽';

        document.getElementById(
            'actionButtons'
        ).style.display='flex';

        /*
          Выигрыш добавляется в инвентарь.
        */

        const won={
            ...currentWonItem
        };

        currentUser.inventory.push(won);

        if(
            won.value>
            currentUser.bestDrop.value
        ){

            currentUser.bestDrop={
                ...won
            };

        }

        saveUserData();

    },4250);

}


/* =========================================================
   SELL
   ========================================================= */

function sellCurrentItem(){

    if(!currentWonItem)
        return;

    currentUser.balance+=
        currentWonItem.value;

    const index=
        currentUser.inventory.findIndex(
            x=>x.id===currentWonItem.id
        );

    if(index>=0){

        currentUser.inventory.splice(
            index,
            1
        );

    }

    saveUserData();

    document.getElementById(
        'actionButtons'
    ).style.display='none';

    document.getElementById(
        'mainOpenBtn'
    ).style.display='block';

    currentWonItem=null;

}

            createCard(
                item,
                false,

            )

function topUpBalance(){

      Реальный платёж сюда не подключён.
    */

    currentUser.balance+=1000;

    currentUser.stats.totalDeposited+=1000;

    saveUserData();

    renderProfile();

    alert(
        'Баланс пополнен на 1 000 ₽'
    );

}


/* =========================================================
   DEMO INVENTORY
   ========================================================= */

function createDemoInventory(){

    if(currentUser.inventory.length)
        return;

    /*
      Берём реальные предметы из загруженного
      каталога, а не выдуманные SVG/цены.
    */

    const sorted=
        [...CATALOG_ITEMS]
        .sort((a,b)=>a.value-b.value);

    const starter=
        sorted
        .filter(x=>
            x.value>=20 &&
            x.value<=500
        )
        .slice(0,8);

    currentUser.inventory=
        starter.map(x=>({...x}));

    saveUserData();

}


/* =========================================================
   INIT
   ========================================================= */

async function initializeApp(){

    try{

        const data=
            await loadByMykel();

        CATALOG_ITEMS=
            await buildCatalog(
                data.skins
            );

        /*
          Если реальные цены не загрузились,
          каталог не заменяется фейковыми ценами.
        */

        if(!CATALOG_ITEMS.length){

            throw new Error(
                'Не удалось получить реальные цены Steam Market'
            );

        }

        CASES_DATA=
            buildCases(
                CATALOG_ITEMS
            );

        createDemoInventory();

        renderCasesList();

        renderQuickChances();

        renderGrid();

        updateUI();

        renderProfile();

        document.getElementById(
            'loading'
        ).style.display='none';

    }catch(error){

        console.error(error);

        document.getElementById(
            'loadingText'
        ).innerHTML=
            `
            Ошибка загрузки.<br>
            Проверь интернет и попробуй обновить страницу.
            `;

        document.querySelector(
            '.loader'
        ).style.display='none';

    }

}


window.addEventListener(
    'load',
    initializeApp
);
