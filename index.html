<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zenodrop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#0d0f17;
    color:#d1d5db;
    font-family:'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    padding:16px;
    overflow-x:hidden
}

button,input{font:inherit}
button{cursor:pointer}

.container{
    width:100%;
    max-width:480px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:16px
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:1.5px;
    color:#fff
}

.logo span{color:#f59e0b}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid rgba(245,158,11,.5);
    background:#181b25
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover
}

/* NAV */

.nav{
    display:flex;
    gap:6px;
    padding:4px;
    background:#161924;
    border:1px solid #252837;
    border-radius:16px
}

.nav button{
    flex:1;
    border:0;
    background:transparent;
    color:#9297a7;
    padding:12px 5px;
    border-radius:11px;
    font-weight:900;
    text-transform:uppercase
}

.nav button.active{
    background:#f59e0b;
    color:#11131c;
    box-shadow:0 0 20px rgba(245,158,11,.3)
}

/* TABS */

.tab{
    display:none;
    flex-direction:column;
    gap:16px
}

.tab.active{display:flex}

/* LOADING */

.loading{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#0d0f17;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:12px;
    color:#fff;
    font-weight:900;
    transition:opacity .25s
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid rgba(245,158,11,.2);
    border-top-color:#f59e0b;
    border-radius:50%;
    animation:spin 1s linear infinite
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* BUTTON */

.primary{
    width:100%;
    border:0;
    border-radius:15px;
    padding:15px;
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:#11131c;
    font-weight:900;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:1px;
    box-shadow:0 5px 22px rgba(245,158,11,.3)
}

.primary:disabled{
    opacity:.45;
    box-shadow:none;
    cursor:not-allowed
}

/* WHEEL */

.wheel-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px
}

.wheel{
    width:220px;
    height:220px;
    position:relative
}

.wheel canvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    background:#161924;
    box-shadow:0 0 30px rgba(0,0,0,.65);
    transform-origin:center
}

.pointer{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:16px solid #fbbf24
}

.wheel-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none
}

.percent{
    font-size:25px;
    font-weight:900;
    color:#4ade80
}

.chance-label{
    font-size:9px;
    color:#9ca3af;
    text-transform:uppercase;
    letter-spacing:1px
}

.overlay{
    display:none;
    position:absolute;
    inset:0;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    z-index:5
}

.result{
    display:none;
    position:absolute;
    inset:0;
    border-radius:50%;
    background:rgba(10,12,18,.86);
    z-index:20;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:900
}

/* QUICK */

.quick{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    justify-content:center
}

.quick button{
    background:#161924;
    border:1px solid #292c39;
    color:#d1d5db;
    border-radius:9px;
    padding:8px 13px;
    font-weight:800
}

.quick button.active{
    color:#f59e0b;
    border-color:#f59e0b;
    background:rgba(245,158,11,.07)
}

.quick .settings{color:#f59e0b}

/* SELECTION */

.selection{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}

.skin-card{
    min-width:0;
    min-height:180px;
    padding:14px;
    border-radius:17px;
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid #282b37;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    text-align:center;
    overflow:hidden
}

.skin-card.target{
    border-color:rgba(245,158,11,.3)
}

.type{
    color:#9297a7;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px
}

.skin-name{
    width:100%;
    font-size:13px;
    font-weight:900;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.skin-img{
    width:100%;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:center
}

.skin-img img{
    max-width:100%;
    max-height:72px;
    object-fit:contain;
    filter:drop-shadow(0 5px 10px #000)
}

.price{
    font-size:15px;
    font-weight:900;
    color:#fbbf24
}

/* PANEL */

.panel{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid #252837;
    border-radius:20px;
    padding:16px
}

.tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:12px
}

.tabs button{
    background:#11131c;
    border:1px solid #272a36;
    color:#9297a7;
    border-radius:9px;
    padding:7px 11px;
    font-weight:800;
    font-size:11px
}

.tabs button.active{
    background:#f59e0b;
    color:#11131c;
    border-color:#f59e0b
}

.filters{
    display:none;
    gap:6px;
    margin-bottom:10px
}

.filters.active{display:flex}

.filters input{
    width:100px;
    background:#11131c;
    border:1px solid #292c38;
    color:#fff;
    border-radius:8px;
    padding:7px 8px;
    outline:none
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    max-height:360px;
    overflow-y:auto;
    contain:content;
    -webkit-overflow-scrolling:touch
}

.item{
    min-width:0;
    background:#11131c;
    border:1px solid #252832;
    border-radius:11px;
    padding:8px;
    text-align:center;
    overflow:hidden;
    contain:layout paint
}

.item.selected{
    border-color:#f59e0b;
    box-shadow:0 0 12px rgba(245,158,11,.18)
}

.item img{
    width:100%;
    height:65px;
    object-fit:contain;
    display:block
}

.item-name{
    width:100%;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.item-price{
    color:#fbbf24;
    font-size:11px;
    font-weight:900;
    margin-top:3px
}

.more{
    grid-column:1/-1;
    padding:11px;
    background:#161924;
    color:#fbbf24;
    border:1px solid rgba(245,158,11,.3);
    border-radius:10px;
    font-weight:900
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#6b7280;
    padding:25px 10px;
    font-size:12px
}

/* CASES */

.cases-title{
    color:#fff;
    font-weight:900;
    font-size:16px
}

.cases{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px
}

.case{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid #292c37;
    border-radius:17px;
    padding:15px;
    text-align:center
}

.case img{
    width:100%;
    height:85px;
    object-fit:contain;
    display:block;
    margin-bottom:5px
}

.case-name{
    font-weight:900;
    color:#fff;
    font-size:13px
}

.case-price{
    color:#fbbf24;
    font-weight:900;
    font-size:13px
}

/* OPENING */

.opening{
    display:none;
    flex-direction:column;
    gap:16px
}

.opening.active{display:flex}

.back{
    align-self:flex-start;
    background:#161924;
    color:#a5aab9;
    border:1px solid #292c37;
    border-radius:9px;
    padding:8px 12px;
    font-weight:800
}

.open-title{
    text-align:center;
    color:#fff;
    font-size:17px;
    font-weight:900
}

.roulette{
    height:120px;
    width:100%;
    overflow:hidden;
    position:relative;
    background:#111216;
    border:1px solid #292a30;
    border-radius:13px
}

.track{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    display:flex;
    gap:10px;
    will-change:transform
}

.roulette-item{
    width:100px;
    min-width:100px;
    height:100%;
    background:#191a1f;
    border:1px solid #2d2e35;
    border-radius:9px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-size:10px
}

.roulette-item img{
    width:75px;
    height:55px;
    object-fit:contain
}

.roulette-item strong{
    width:90px;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.roulette-item span{
    color:#fbbf24;
    font-size:9px
}

.roulette-pointer{
    position:absolute;
    z-index:10;
    left:50%;
    top:0;
    bottom:0;
    width:3px;
    background:#f59e0b;
    transform:translateX(-50%)
}

.actions{
    display:none;
    gap:8px
}

.actions button{
    flex:1;
    padding:13px;
    border-radius:11px;
    font-weight:900;
    border:0
}

.sell{
    background:#25272e;
    color:#fbbf24;
    border:1px solid #fbbf24!important
}

.retry{
    background:#f59e0b;
    color:#111
}

/* PROFILE */

.profile{
    display:flex;
    flex-direction:column;
    gap:12px
}

.profile-box{
    background:linear-gradient(145deg,#161924,#11131c);
    border:1px solid #292c37;
    border-radius:17px;
    padding:16px
}

.profile-top{
    display:flex;
    justify-content:space-between;
    color:#fff;
    font-weight:900
}

.logout{
    color:#f87171;
    cursor:pointer
}

.profile-avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    overflow:hidden;
    margin:15px auto;
    border:2px solid #343744;
    background:#111
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px
}

.stat{
    background:#11131c;
    border:1px solid #252832;
    border-radius:11px;
    padding:10px;
    text-align:center
}

.stat small{
    display:block;
    color:#858b9a;
    font-size:8px;
    font-weight:800
}

.stat b{
    display:block;
    color:#fff;
    margin-top:3px
}

.balance{
    margin-top:10px;
    padding:12px;
    background:#11131c;
    border:1px solid #252832;
    border-radius:11px;
    display:flex;
    justify-content:space-between;
    align-items:center
}

.balance b{color:#fff}

.topup{
    background:#f59e0b;
    color:#111;
    border:0;
    border-radius:9px;
    padding:9px 13px;
    font-weight:900
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center
}

.modal-box{
    width:300px;
    background:#161924;
    border:1px solid #292c37;
    border-radius:17px;
    padding:20px
}

.modal-box h3{
    color:#fff;
    margin-bottom:8px
}

.modal-box p{
    font-size:11px;
    color:#9297a7;
    margin-bottom:10px
}

.modal-box input{
    width:100%;
    padding:10px;
    background:#11131c;
    border:1px solid #292c37;
    border-radius:9px;
    color:#fff;
    outline:none
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:12px
}

.modal-buttons button{
    flex:1;
    border:0;
    border-radius:9px;
    padding:10px;
    font-weight:900
}

.save{background:#f59e0b}
.close{background:#292c37;color:#aaa}
</style>
</head>

<body>

<script>

/* =========================================================
   CONFIG
========================================================= */

const API_SKINS =
'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins_not_grouped.json';

const STEAM =
'https://steamcommunity.com/market';

const PROXIES = [

'https://api.allorigins.win/raw?url=',
'https://corsproxy.io/?url='

];

const CACHE_KEY =
'zenodrop_steam_prices_v7';

const CACHE_TTL =
5*60*1000;

const PAGE_SIZE = 40;

/* =========================================================
   STATE
========================================================= */

let catalog = [];
let cases = [];
let priceMap = {};

let catalogType = 'inventory';
let visibleCount = PAGE_SIZE;

let selectedIndex = null;
let target = null;
let activeChance = null;

let activeCase = null;
let wonItem = null;

let spinning = false;
let priceLoading = false;

let user = {

    username:'Гость',
    avatar:'',

    balance:3500,

    inventory:[],

    stats:{
        upgradesTotal:0,
        casesOpened:0,
        totalDeposited:0
    },

    bestDrop:{
        name:'--',
        value:0,
        img:''
    }

};

/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
document.getElementById(id);

function money(n){

    return Number(n||0).toFixed(2)+' ₽';

}

function esc(s){

    return String(s??'').replace(/[&<>"']/g,c=>({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

    }[c]));

}

function sleep(ms){

    return new Promise(resolve=>
        setTimeout(resolve,ms)
    );

}

/* =========================================================
   TIMEOUT FETCH
========================================================= */

async function fetchTimeout(
    url,
    options={},
    timeout=7000
){

    const controller =
    new AbortController();

    const timer =
    setTimeout(
        ()=>controller.abort(),
        timeout
    );

    try{

        const response =
        await fetch(
            url,
            {
                ...options,
                signal:controller.signal,
                cache:'no-store'
            }
        );

        clearTimeout(timer);

        if(!response.ok)
            throw new Error(
                'HTTP '+response.status
            );

        return response;

    }catch(e){

        clearTimeout(timer);

        throw e;

    }

}

/* =========================================================
   JSON
========================================================= */

async function getJSON(url){

    const r =
    await fetchTimeout(
        url,
        {},
        9000
    );

    return r.json();

}

/* =========================================================
   PROXY
========================================================= */

async function proxyJSON(url){

    for(const proxy of PROXIES){

        try{

            const finalURL =
            proxy+
            encodeURIComponent(url);

            const r =
            await fetchTimeout(
                finalURL,
                {},
                4500
            );

            return await r.json();

        }catch(e){}

    }

    throw new Error('Steam unavailable');

}

/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadUser(){

    try{

        const data =
        JSON.parse(
            localStorage.getItem(
                'zenodrop_user'
            )||'null'
        );

        if(data){

            user = {
                ...user,
                ...data,
                stats:{
                    ...user.stats,
                    ...(data.stats||{})
                }
            };

        }

    }catch(e){}

}

function saveUser(){

    try{

        localStorage.setItem(
            'zenodrop_user',
            JSON.stringify(user)
        );

    }catch(e){}

}

/* =========================================================
   PRICE CACHE
========================================================= */

function loadPriceCache(){

    try{

        const data =
        JSON.parse(
            localStorage.getItem(
                CACHE_KEY
            )||'null'
        );

        if(
            data &&
            data.time &&
            Date.now()-data.time<CACHE_TTL &&
            data.prices
        ){

            priceMap=data.prices;

            return true;

        }

    }catch(e){}

    return false;

}

function savePriceCache(){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                time:Date.now(),

                prices:priceMap

            })
        );

    }catch(e){}

}

/* =========================================================
   PRICE PARSER
========================================================= */

function parsePrice(value){

    if(value===null||
       value===undefined)
        return 0;

    if(
        typeof value==='number'
    ){

        return value>0
            ?value/100
            :0;

    }

    const match =
    String(value)
    .replace(/\s/g,'')
    .match(
        /[0-9]+(?:[.,][0-9]+)?/
    );

    if(!match)return 0;

    const number =
    parseFloat(
        match[0].replace(',','.')
    );

    return Number.isFinite(number)
        ?number
        :0;

}

/* =========================================================
   STEAM PRICE
========================================================= */

async function getSteamPrice(name){

    if(
        priceMap[name] &&
        priceMap[name]>0
    ){

        return priceMap[name];

    }

    try{

        const url =
        STEAM+
        '/priceoverview/?appid=730'+
        '&currency=5'+
        '&market_hash_name='+
        encodeURIComponent(name);

        const data =
        await proxyJSON(url);

        if(
            data &&
            data.success
        ){

            let price=0;

            if(
                data.lowest_price_value &&
                Number(data.lowest_price_value)>0
            ){

                price =
                Number(
                    data.lowest_price_value
                )/100;

            }

            if(
                !price &&
                data.lowest_price
            ){

                price =
                parsePrice(
                    data.lowest_price
                );

            }

            if(price>0){

                priceMap[name]=price;

                return price;

            }

        }

    }catch(e){}

    return 0;

}

/* =========================================================
   LOAD CATALOG
   ВАЖНО:
   Сайт НЕ ждёт цены.
========================================================= */

async function loadCatalog(){

    $('loadingText').textContent =
    'Загрузка скинов...';

    const raw =
    await getJSON(API_SKINS);

    const array =
    Array.isArray(raw)
    ?raw
    :Object.values(raw);

    const map = new Map();

    for(
        let i=0;
        i<array.length;
        i++
    ){

        const x=array[i];

        if(
            !x ||
            !x.image ||
            !(x.market_hash_name||x.name)
        )continue;

        const name =
        String(
            x.market_hash_name||x.name
        ).trim();

        if(!map.has(name)){

            map.set(
                name,
                {

                    id:
                    x.id||
                    'skin_'+i,

                    name:name,

                    category:'skins',

                    img:x.image,

                    value:
                    Number(
                        priceMap[name]||0
                    )

                }
            );

        }

    }

    catalog =
    [...map.values()];

}

/* =========================================================
   BACKGROUND PRICES
========================================================= */

async function loadPricesInBackground(){

    if(priceLoading)return;

    priceLoading=true;

    const need =
    catalog.filter(
        x=>!priceMap[x.name]
    );

    /*
       Только 100 за один запуск.
       Не блокирует сайт.
    */

    const list =
    need.slice(0,100);

    let position=0;

    const worker = async()=>{

        while(true){

            const index =
            position++;

            if(index>=list.length)
                return;

            const item=list[index];

            const price =
            await getSteamPrice(
                item.name
            );

            if(price>0){

                item.value=price;

            }

            /*
               Маленькая задержка,
               чтобы не DDOSить Steam.
            */

            await sleep(80);

        }

    };

    await Promise.all([

        worker(),
        worker(),
        worker(),
        worker()

    ]);

    catalog.forEach(x=>{

        if(priceMap[x.name])
            x.value =
            priceMap[x.name];

    });

    savePriceCache();

    /*
       Обновляем интерфейс только один раз
       после фоновой загрузки.
    */

    renderGrid();
    renderCases();
    updateUI();

    priceLoading=false;

    /*
       Если ещё остались предметы,
       продолжаем следующей пачкой.
    */

    const left =
    catalog.filter(
        x=>!priceMap[x.name]
    ).length;

    if(left>0){

        setTimeout(
            loadPricesInBackground,
            500
        );

    }

}

function getCaseBands(price){

    const m =
    price/100;

    return [

        {
            min:10*m,
            max:Infinity,
            chance:.002
        },

        {
            min:5*m,
            max:10*m,
            chance:1
        },

        {
            min:4*m,
            max:5*m,
            chance:5
        },

        {
            min:3*m,
            max:4*m,
            chance:7
        },

        {
            min:2*m,
            max:3*m,
            chance:9
        },

        {
            min:1.5*m,
            max:2*m,
            chance:7.998
        },

        {
            min:0,
            max:1.5*m,
            chance:70
        }

    ];

}

function randomFrom(array){

    if(!array.length)
        return null;

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}

function buildCase(price){

    const all =
    catalog.filter(
        x=>x.img
    );

    if(!all.length)
        return [];

    const result=[];
    const used=new Set();

    function add(item){

        if(
            item &&
            !used.has(item.id)
        ){

            used.add(item.id);
            result.push(item);

        }

    }

    const bands =
    getCaseBands(price);

    for(const band of bands){

        const pool =
        all.filter(
            x=>
            x.value>0 &&
            x.value>=band.min &&
            x.value<band.max
        );

        for(
            let i=0;
            i<Math.min(3,pool.length);
            i++
        ){

            add(
                randomFrom(pool)
            );

        }

    }

    /*
       Если цены ещё не успели загрузиться,
       кейс всё равно НЕ пустой.
    */

    if(result.length<8){

        const fallback =
        all
        .filter(x=>x.value>0);

        for(
            const item of fallback
        ){

            if(result.length>=20)
                break;

            add(item);

        }

    }

    /*
       Последний fallback —
       реальные изображения ByMykel.
    */

    if(result.length<8){

        for(
            const item of all
        ){

            if(result.length>=20)
                break;

            add(item);

        }

    }

    return result;

}

function renderGrid(){

    const grid =
    $('itemsGrid');

    grid.replaceChildren();

    let items=[];

    if(catalogType==='inventory'){

        items=user.inventory;

    }else{

        const min =
        Number(
            $('minPrice').value
        )||0;

        const max =
        Number(
            $('maxPrice').value
        )||Infinity;

        items =
        catalog.filter(
            x=>
            x.category===catalogType &&
            x.value>=min &&
            x.value<=max
        );

    }

    if(!items.length){

        grid.innerHTML =
        '<div class="empty">Скины не найдены</div>';

        return;

    }

    const fragment =
    document.createDocumentFragment();

    const count =
    Math.min(
        visibleCount,
        items.length
    );

    for(
        let i=0;
        i<count;
        i++
    ){

        const item=items[i];

        fragment.appendChild(

            makeCard(

                item,

                catalogType==='inventory'
                ?selectedIndex===i
                :target?.id===item.id,

                ()=>{

                    if(
                        catalogType===
                        'inventory'
                    ){

                        selectInventory(i);

                    }else{

                        selectTarget(item);

                    }

                }

            )

        );

    }

    if(count<items.length){

        const more =
        document.createElement('button');

        more.className='more';

        more.textContent=
        'Показать ещё';

        more.onclick=()=>{

            visibleCount+=PAGE_SIZE;

            renderGrid();

        };

        fragment.appendChild(more);

    }

    grid.appendChild(fragment);

let quickChances=[
    10,20,30,40,50,70
];

function renderQuick(){

    const q=$('quick');

    q.replaceChildren();

    quickChances.forEach(ch=>{

        const button =
        document.createElement('button');

        button.textContent=
        ch+'%';

        if(activeChance===ch)
            button.classList.add('active');

        button.onclick=()=>
        applyChance(ch);

        q.appendChild(button);

    });

    const settings =
    document.createElement('button');

    settings.className='settings';

    settings.textContent='⚙';

    q.appendChild(settings);

function applyChance(chance){

    if(
        selectedIndex===null ||
        !user.inventory[selectedIndex]
    ){

        alert(
            'Сначала выберите свой скин'
        );

        return;

    }

    const source =
    user.inventory[selectedIndex];

    if(source.value<=0){

        alert(
            'Цена выбранного скина ещё загружается'
        );

        return;

    }

    const desired =
    source.value/(chance/100);

    let best=null;
    let difference=Infinity;

    for(const item of catalog){

        if(item.value<=source.value)
            continue;

        if(item.value<=0)
            continue;

        const diff =
        Math.abs(
            item.value-desired
        );

        if(diff<difference){

            difference=diff;
            best=item;

        }

    }

    if(best){

        target=best;
        activeChance=chance;

        renderQuick();
        updateUI();

    }

}

        $('targetImage')
        .innerHTML='';

    }

    let chance=0;

    if(
        source &&
        target &&
        target.value>source.value
    ){

        chance =
        activeChance!==null
        ?activeChance
        :Math.min(
            source.value/

            70
        );

    }

    $('percent')
    .textContent=
    chance.toFixed(2)+'%';

    drawWheel(chance);

    $('upgradeBtn').disabled =
    !(
        source &&

        target.value>source.value &&
        chance>0 &&
        chance<=70 &&
        !spinning
    );

}

/* =========================================================
   WHEEL
========================================================= */

const canvas=$('wheel');

const ctx=
canvas.getContext('2d');

function drawWheel(chance){

    const center=150;
    const radius=140;

    ctx.clearRect(
        0,0,300,300
    );

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle='#161924';
    ctx.fill();

    if(chance>0){

        ctx.beginPath();

        ctx.moveTo(
            center,
            center
        );

        ctx.arc(
            center,
            center,
            radius,
            -Math.PI/2,
            -Math.PI/2+
            chance/100*
            Math.PI*2
        );

        ctx.closePath();

        ctx.fillStyle='#f59e0b';
        ctx.fill();

    }

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        112,
        0,
        Math.PI*2
    );

    ctx.fillStyle='#11131c';
    ctx.fill();

}

let wheelRotation=0;

$('upgradeBtn').onclick=()=>{

    if(
        spinning ||
        selectedIndex===null ||
        !target
    )return;

    const source =
    user.inventory[selectedIndex];

    const chance =
    activeChance!==null
    ?activeChance
    :Math.min(
        source.value/
        target.value*
        100,
        70
    );

    if(
        !source ||
        !target ||
        source.value<=0 ||
        target.value<=source.value
    )return;

    spinning=true;

    $('upgradeBtn').disabled=true;
    $('wheelOverlay').style.display='block';

    const success =
    Math.random()*100<chance;

    user.stats.upgradesTotal++;

    saveUser();

    const sector =
    chance*3.6;

    const angle =
    success
    ?-90+
      sector*
      (.1+
      Math.random()*.8)
    :-90+
      sector+
      (360-sector)*
      (.1+
      Math.random()*.8);

    const current =
    ((wheelRotation%360)+360)%360;

    let delta =
    (-90-angle-current)%360;

    if(delta<0)
        delta+=360;

    wheelRotation+=
    2160+delta;

    canvas.style.transition=
    'transform 3.6s cubic-bezier(.15,.85,.35,1)';

    canvas.style.transform=
    `rotate(${wheelRotation}deg)`;

    setTimeout(()=>{

        $('result').style.display='flex';

        $('result').textContent=
        success
        ?'Успех!'
        :'Неудача';

        $('result').style.color=
        success
        ?'#4ade80'
        :'#f87171';

        const index =
        user.inventory.findIndex(
            x=>x.id===source.id
        );

        if(index>=0)
            user.inventory.splice(index,1);

        if(success){

            const won={
                ...target
            };

            user.inventory.push(won);

            if(
                won.value>
                (user.bestDrop?.value||0)
            ){

                user.bestDrop={
                    ...won
                };

            }

        }

        saveUser();

    },3700);

    setTimeout(()=>{

        $('result').style.display='none';

        $('wheelOverlay').style.display='none';

        spinning=false;

        selectedIndex=null;
        target=null;
        activeChance=null;

        canvas.style.transition='none';

        wheelRotation=
        ((wheelRotation%360)+360)%360;

        canvas.style.transform=
        `rotate(${wheelRotation}deg)`;

        renderQuick();
        renderGrid();
        updateUI();

    },5500);

};

/* =========================================================
   CASE SPIN
========================================================= */

function chooseBand(price){

    const bands=
    getCaseBands(price);

    let random=
    Math.random()*100;

    for(const band of bands){

        if(random<band.chance)
            return band;

        random-=band.chance;

    }

    return bands[bands.length-1];

}

function openCaseSpin(){

    if(
        spinning ||
        !activeCase
    )return;

    if(
        user.balance<
        activeCase.price
    ){

        alert(
            'Недостаточно средств!'
        );

        return;

    }

    if(
        !activeCase.items.length
    ){

        activeCase.items=
        buildCase(
            activeCase.price
        );

        renderCaseContents();
        renderTrack();

    }

    if(
        !activeCase.items.length
    ){

        alert(
            'Кейс пока не готов'
        );

        return;

    }

    user.balance -=
    activeCase.price;

    user.stats.casesOpened++;

    saveUser();

    spinning=true;

    $('openCaseBtn')
    .style.display='none';

    $('actions')
    .style.display='none';

    const band=
    chooseBand(
        activeCase.price
    );

    let pool =
    activeCase.items.filter(
        x=>
        x.value>0 &&
        x.value>=band.min &&
        x.value<band.max
    );

    if(!pool.length){

        pool=
        activeCase.items.filter(
            x=>x.value>0
        );

    }

    if(!pool.length)
        pool=activeCase.items;

    wonItem=
    randomFrom(pool);

    const index=
    activeCase.items.findIndex(
        x=>x.id===wonItem.id
    );

    const itemWidth=110;

    const center=200;

    const cycles=3;

    const distance =
    cycles*
    activeCase.items.length*
    itemWidth+
    index*
    itemWidth-
    center;

    $('track').style.transition='none';

    $('track').style.transform=
    'translate3d(0,0,0)';

    requestAnimationFrame(()=>{

        requestAnimationFrame(()=>{

            $('track').style.transition=
            'transform 4s cubic-bezier(.15,.85,.35,1)';

            $('track').style.transform=
            `translate3d(-${distance}px,0,0)`;

        });

    });

    setTimeout(()=>{

        spinning=false;

        const drop={
            ...wonItem
        };

        user.inventory.push(drop);

        if(
            drop.value>
            (user.bestDrop?.value||0)
        ){

            user.bestDrop={
                ...drop
            };

        }

        saveUser();

        $('sellBtn').textContent=
        drop.value>0
        ?'Продать за '+money(drop.value)
        :'Продать';

        $('actions').style.display='flex';

    },4300);

}

/* =========================================================
   SELL
========================================================= */

function sellDrop(){

    if(!wonItem)return;

    if(wonItem.value>0){

        user.balance +=
        wonItem.value;

    }

    const index=
    user.inventory.findIndex(
        x=>x.id===wonItem.id
    );

    if(index>=0)
        user.inventory.splice(index,1);

    wonItem=null;

    saveUser();

    $('actions')
    .style.display='none';

    $('openCaseBtn')
    .style.display='block';

}

/* =========================================================
   CLOSE CASE
========================================================= */

function closeCase(){

    if(spinning)return;

    $('opening')
    .classList.remove('active');

    $('casesList')
    .style.display='block';

}

/* =========================================================
   PROFILE
========================================================= */

function renderProfile(){

    const p=$('profile');

    const best=
    user.bestDrop||{
        name:'--',
        value:0,
        img:''
    };

    p.innerHTML=`

    <div class="profile-box">

        <div class="profile-top">

            <span>
                ${esc(user.username)}
            </span>

            <span
                class="logout"
                onclick="logout()"
            >
                Выйти
            </span>

        </div>

        <div class="profile-avatar">

            ${
                user.avatar
                ?
                `<img src="${esc(user.avatar)}">`
                :
                ''
            }

        </div>

        <div class="stats">

            <div class="stat">

                <small>
                    Апгрейды
                </small>

                <b>
                    ${user.stats.upgradesTotal}
                </b>

            </div>

            <div class="stat">

                <small>
                    Кейсы
                </small>

                <b>
                    ${user.stats.casesOpened}
                </b>

            </div>

            <div class="stat">

                <small>
                    Депозит
                </small>

                <b>
                    ${user.stats.totalDeposited} ₽
                </b>

            </div>

        </div>

        <div class="balance">

            <b>
                ${money(user.balance)}
            </b>

            <button
                class="topup"
                onclick="topUp()"
            >
                Пополнить
            </button>

        </div>

    </div>

    <div class="profile-box">

        <div class="type">
            Лучший дроп
        </div>

        <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-top:10px
        ">

            <div>

                <div style="
                    color:#fff;
                    font-weight:900;
                    font-size:12px
                ">
                    ${esc(best.name)}
                </div>

                <div style="
                    color:#fbbf24;
                    font-weight:900;
                    margin-top:4px
                ">
                    ${
                        best.value>0
                        ?money(best.value)
                        :'--'
                    }
                </div>

            </div>

            ${
                best.img
                ?
                `<img
                    src="${esc(best.img)}"
                    style="
                        width:65px;
                        height:45px;
                        object-fit:contain
                    "
                >`
                :
                ''
            }

        </div>

    </div>

    <div class="profile-box">

        <div style="
            color:#fff;
            font-weight:900;
            margin-bottom:10px
        ">
            Инвентарь (${user.inventory.length})
        </div>

        <div
            class="grid"
            id="profileGrid"
        ></div>

    </div>

    `;

    const grid=
    $('profileGrid');

    const fragment=
    document.createDocumentFragment();

    user.inventory.forEach(item=>{

        fragment.appendChild(
            makeCard(
                item,
                false,
                ()=>{}
            )
        );

    });

    grid.appendChild(fragment);

}

function topUp(){

    user.balance+=1000;

    user.stats.totalDeposited+=1000;

    saveUser();

    renderProfile();

}

function logout(){

    localStorage.removeItem(
        'zenodrop_user'
    );

    location.reload();

}

/* =========================================================
   MODAL
========================================================= */

function closeModal(){

    $('modal')
    .style.display='none';

}

function saveQuick(){

    const values =
    $('quickInput')
    .value
    .split(',')
    .map(x=>parseInt(x.trim()))
    .filter(
        x=>
        Number.isFinite(x)&&
        x>0&&
        x<=70
    );

    if(values.length){

        quickChances=[
            ...new Set(values)
        ];

    }

    closeModal();

    renderQuick();

}

/* =========================================================
   FILTER
========================================================= */

let filterTimer=null;

function filterChanged(){

    clearTimeout(filterTimer);

    filterTimer=
    setTimeout(()=>{

        visibleCount=
        PAGE_SIZE;

        renderGrid();

    },150);

}

$('minPrice')
.addEventListener(
    'input',
    filterChanged
);

$('maxPrice')
.addEventListener(
    'input',
    filterChanged
);

/* =========================================================
   HEADER
========================================================= */

function renderHeader(){

    if(user.avatar){

        $('headerAvatar').innerHTML=
        `<img src="${esc(user.avatar)}">`;

    }else{

        $('headerAvatar').innerHTML=
        `<div style="
            width:100%;
            height:100%;
            background:#292c35
        "></div>`;

    }

}

/* =========================================================
   QUICK
========================================================= */

renderQuick();

/* =========================================================
   INIT
========================================================= */

async function init(){

    loadUser();

    renderHeader();

    renderQuick();

    /*
       Загружаем ТОЛЬКО каталог.
       Цены здесь НЕ ждём.
    */

    try{

        await loadCatalog();

    }catch(error){

        console.error(error);

        $('loadingText').innerHTML=
        'Ошибка загрузки скинов.<br>'+
        '<small style="color:#777">'+
        'Проверь интернет и обнови страницу.'+
        '</small>';

        return;

    }

    /*
       Создаём кейсы сразу.
    */

    createCases();

    /*
       Если инвентарь пустой,
       выдаём первые доступные предметы.
    */

    if(!user.inventory.length){

        const starter =
        catalog
        .filter(
            x=>x.img
        )
        .slice(0,3);

        user.inventory=
        starter.map(
            x=>({...x})
        );

        saveUser();

    }

    renderGrid();

    updateUI();

    renderCases();

    /*
       ВОТ ЗДЕСЬ САМОЕ ГЛАВНОЕ:
       загрузочный экран больше НЕ ждёт Steam.
    */

    $('loading')
    .style.opacity='0';

    setTimeout(()=>{

        $('loading')
        .style.display='none';

    },250);

    /*
       ЦЕНЫ НАЧИНАЮТ ГРУЗИТЬСЯ
       УЖЕ ПОСЛЕ ОТКРЫТИЯ САЙТА.
    */

    setTimeout(()=>{

        loadPricesInBackground();

    },300);

}

/* =========================================================
   START
========================================================= */

window.addEventListener(
    'load',
    init
);

</script>
