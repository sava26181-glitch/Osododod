<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenodrop - Открытие кейсов CS2</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #131823;
            --accent-color: #7000ff;
            --accent-hover: #8322ff;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --border-color: #222b3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Навигация / Шапка */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo span {
            color: var(--accent-color);
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-steam {
            background-color: #1b2838;
            color: #fff;
            border: 1px solid #2a475e;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-steam:hover {
            background-color: #2a475e;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1c2433;
            padding: 5px 15px 5px 5px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .user-profile img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        /* Лента последних выигрышей (как на скриншотах конкурентов) */
        .latest-drops-wrapper {
            background: rgba(19, 24, 35, 0.7);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            overflow: hidden;
        }

        .latest-drops-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .drops-ticker {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .drops-ticker::-webkit-scrollbar {
            display: none;
        }

        .drop-card {
            min-width: 120px;
            background: #171f30;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .drop-price {
            font-size: 11px;
            color: #f39c12;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .drop-name {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Основной контент */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .case-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .case-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .case-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin: 10px auto;
        }

        .case-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-open {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-open:hover {
            background-color: var(--accent-hover);
        }

        /* Модальное окно открытия кейса */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .won-item-name {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 5px;
        }

        .won-item-price {
            font-size: 16px;
            color: #f39c12;
            margin-bottom: 20px;
        }

        .btn-close-modal {
            background: var(--border-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="logo">ZENO<span>DROP</span></div>
        <div id="auth-container">
            <!-- Динамически заменяется скриптом в зависимости от входа -->
            <a href="/auth/steam" class="btn-steam">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.43 9.8 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                Войти через Steam
            </a>
        </div>
    </header>

    <!-- Лента последних выигрышей -->
    <div class="latest-drops-wrapper">
        <div class="latest-drops-title">У нас выигрывают</div>
        <div class="drops-ticker" id="drops-ticker">
            <!-- Заполняется динамически -->
        </div>
    </div>

    <!-- Основное содержимое -->
    <main>
        <h2 class="section-title">Доступные кейсы</h2>
        <div class="cases-grid">
            <!-- Кейс 1: За 100 рублей (с настроенными скрытыми шансами) -->
            <div class="case-card">
                <div>
                    <img src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpotLu8JAllzuzLfThB59m_h5WGkvP9J4TQmlRZ7cR6j--Y8d6h2wXhqEU9ZG2mcY6dcAI8YwyCrVe4yOm5g8K9uprMmHU17nAis37dn0azhx1ScKU70vyaBw/360fx360f" alt="Кейс" class="case-img">
                    <div class="case-name">Стартовый кейс</div>
                </div>
                <button class="btn-open" onclick="openCase(100)">Открыть за 100 ₽</button>
            </div>

            <!-- Кейс 2 -->
            <div class="case-card">
                <div>
                    <img src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpotLu8JAllzuzLfThB59m_h5WGkvP9J4TQmlRZ7cR6j--Y8d6h2wXhqEU9ZG2mcY6dcAI8YwyCrVe4yOm5g8K9uprMmHU17nAis37dn0azhx1ScKU70vyaBw/360fx360f" alt="Кейс" class="case-img">
                    <div class="case-name">Элитный кейс</div>
                </div>
                <button class="btn-open" onclick="openCase(500)">Открыть за 500 ₽</button>
            </div>
        </div>
    </main>

    <!-- Модальное окно результата -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h3>Поздравляем с выигрышем!</h3>
            <div class="won-item-name" id="won-name">AK-47 | Redline</div>
            <div class="won-item-price" id="won-price">125 ₽</div>
            <button class="btn-close-modal" onclick="closeModal()">Забрать в инвентарь</button>
        </div>
    </div>

    <footer>
        ZENODROP © 2026. Все права защищены. Не связано с Valve Corp.
    </footer>

    <script>
        // Проверка параметров авторизации из URL после редиректа со Steam
        const urlParams = new URLSearchParams(window.location.search);
        const steamId = urlParams.get('steamId');
        const name = urlParams.get('name');
        const avatar = urlParams.get('avatar');

        if (steamId && name) {
            const authContainer = document.getElementById('auth-container');
            authContainer.innerHTML = `
                <div class="user-profile">
                    <img src="${decodeURIComponent(avatar)}" alt="avatar">
                    <span style="font-size: 14px; font-weight: 600;">${decodeURIComponent(name)}</span>
                    <a href="/logout" style="color: #ff4757; text-decoration: none; font-size: 12px; margin-left: 10px;">Выйти</a>
                </div>
            `;
        }

        // Подгрузка живой ленты побед
        async function loadDrops() {
            try {
                const res = await fetch('/api/latest-drops');
                const data = await res.json();
                if (data.success) {
                    const ticker = document.getElementById('drops-ticker');
                    ticker.innerHTML = data.drops.map(drop => `
                        <div class="drop-card">
                            <div class="drop-price">${drop.price} ₽</div>
                            <div class="drop-name" title="${drop.name}">${drop.name}</div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error("Ошибка ленты выигрышей");
            }
        }
        loadDrops();
        setInterval(loadDrops, 12000);

        // Функция открытия кейса с запросом к серверу
        async function openCase(price) {
            try {
                const response = await fetch('/api/open-case', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ casePrice: price })
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('won-name').textContent = data.item.name;
                    document.getElementById('won-price').textContent = `${data.item.price} ₽`;
                    document.getElementById('result-modal').style.display = 'flex';
                }
            } catch (e) {
                alert("Ошибка открытия кейса!");
            }
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }
    </script>
</body>
</html>
